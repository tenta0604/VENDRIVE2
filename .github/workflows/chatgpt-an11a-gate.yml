name: AN11A temporary verification

on:
  push:
    branches:
      - chatgpt/an11a-visit-planning

permissions:
  contents: read

jobs:
  verify-an11a:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify baseline and immutable safety tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'fbdc7f658a8f3dfd0a9bf1622aef2824f8ff5f08'
          $tag = 'backup-pre-AN11A-AN10-20260914'
          git fetch origin main --tags
          $remoteMain = (git rev-parse origin/main).Trim()
          if ($remoteMain -ne $base) { throw "origin/main moved from expected AN11A base: $remoteMain" }
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          if ((git cat-file -t $tag).Trim() -ne 'tag') { throw 'Safety ref is not annotated.' }
          if ((git rev-parse "$tag^{}").Trim() -ne $base) { throw 'Safety tag target mismatch.' }
          Write-Host "AN11A_SAFETY_TAG_PASS"

      - name: Version, state, and bridge compatibility gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Get-Content '.ai/STATE.json' -Raw | ConvertFrom-Json
          $version = Get-Content 'version.json' -Raw | ConvertFrom-Json
          $index = Get-Content 'index.html' -Raw
          $analytics = Get-Content 'analytics.js' -Raw
          $roadmap = Get-Content 'AI_ROADMAP.md' -Raw
          if ($state.completedPhase -ne 'AN11A' -or $state.nextPhase -ne 'AN11B' -or $state.status -ne 'ready') { throw 'STATE phase mismatch.' }
          if ($state.appVersion -ne '2026.09.14-AN11A' -or $state.engineVersion -ne 'AN11A' -or $state.dbVersion -ne 4 -or $state.schemaVersion -ne 4) { throw 'STATE version mismatch.' }
          if ($version.version -ne '2026.09.14-AN11A') { throw 'version.json mismatch.' }
          if ($index -notmatch "APP_VERSION='2026\.09\.14-AN11A'") { throw 'index APP_VERSION mismatch.' }
          if ($analytics -notmatch 'ENGINE_VERSION="AN11A"') { throw 'analytics ENGINE_VERSION mismatch.' }
          if ($index -notmatch 'VENDRIVE2ReadBridge=Object\.freeze\(\{version:1') { throw 'Bridge version 1 compatibility was not preserved.' }
          if ($index -notmatch 'getPlanningSnapshot:function') { throw 'Planning bridge method missing.' }
          if ($roadmap -notmatch 'Latest completed phase: \*\*AN11A — Visit Planning / Route Constraint Foundation\*\*') { throw 'ROADMAP completed mismatch.' }
          if ($roadmap -notmatch 'Next phase: \*\*AN11B — Machine Bring-from-vehicle Recommendation Foundation\*\*') { throw 'ROADMAP next mismatch.' }
          Write-Host "AN11A_VERSION_STATE_BRIDGE_PASS"

      - name: Diff check
        shell: pwsh
        run: |
          git diff --check origin/main...HEAD
          Write-Host "AN11A_DIFF_CHECK_PASS"

      - name: JavaScript syntax gates
        shell: pwsh
        run: |
          node --check analytics.js
          @'
          import re, pathlib
          text=pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts=[]
          for m in re.finditer(r"<script([^>]*)>(.*?)</script>", text, re.S|re.I):
              attrs=m.group(1)
              body=m.group(2)
              if "src=" not in attrs.lower() and body.strip():
                  scripts.append(body)
          pathlib.Path("index-inline-check.js").write_text("\n".join(scripts),encoding="utf-8")
          '@ | python -
          node --check index-inline-check.js
          Remove-Item index-inline-check.js
          Write-Host "AN11A_SYNTAX_PASS"

      - name: Real Edge browser and IndexedDB gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $edgeCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe"
          )
          $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw 'Microsoft Edge executable was not found.' }
          $port = 8127
          $server = Start-Process python -ArgumentList @('-m','http.server',"$port",'--bind','127.0.0.1') -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden
          try {
            $ready=$false
            for($attempt=1;$attempt -le 20;$attempt++){
              try{
                $response=Invoke-WebRequest -Uri "http://127.0.0.1:$port/tools/an11a-browser-test.html" -UseBasicParsing -TimeoutSec 2
                if($response.StatusCode -eq 200){$ready=$true;break}
              }catch{Start-Sleep -Milliseconds 500}
            }
            if(-not $ready){throw 'Local AN11A test server did not become ready.'}
            $profile=Join-Path $env:RUNNER_TEMP ("vendrive-an11a-edge-"+$env:GITHUB_RUN_ID)
            $stdout=Join-Path $env:RUNNER_TEMP 'an11a-edge-stdout.txt'
            $stderr=Join-Path $env:RUNNER_TEMP 'an11a-edge-stderr.txt'
            $edgeArgs=@(
              '--headless=new','--disable-gpu','--no-first-run','--no-default-browser-check',
              '--virtual-time-budget=30000',"--user-data-dir=$profile",'--dump-dom',
              "http://127.0.0.1:$port/tools/an11a-browser-test.html"
            )
            $p=Start-Process -FilePath $edge -ArgumentList $edgeArgs -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $text=if(Test-Path $stdout){Get-Content -Raw $stdout}else{''}
            $err=if(Test-Path $stderr){Get-Content -Raw $stderr}else{''}
            Write-Host $text
            if($err){Write-Host "EDGE_STDERR";Write-Host $err}
            if($p.ExitCode -ne 0){throw "Edge exited with code $($p.ExitCode)"}
            if($text -notmatch 'AN11A_BROWSER_PASS'){throw 'AN11A_BROWSER_PASS token not found.'}
            Write-Host "AN11A_REAL_EDGE_PASS"
          }
          finally {
            if($server -and -not $server.HasExited){Stop-Process -Id $server.Id -Force}
          }
