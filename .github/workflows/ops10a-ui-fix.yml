name: OPS10A UI fix
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  fix:
    if: github.actor == github.repository_owner && github.event.issue.title == '[OPS10A-UI-FIX] inventory-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify base and create fix branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "d84e24305fd96589fc96fe159cf42616269b8af5"
          git checkout -b chatgpt/ops10a-ui-fix-20260916
      - name: Apply scoped UI and version fix
        shell: python
        run: |
          from pathlib import Path
          p=Path('ops10a-stocktake.js')
          s=p.read_text(encoding='utf-8')
          old='overlay.append(sheet);document.body.append(fab,overlay);'
          new='''overlay.append(sheet);\nvar analysisPage=document.getElementById("analysisPage"),analysisTabs=analysisPage&&analysisPage.querySelector(".analysisSubTabs");\nvar actionHost=el("div","ops10a-action-host");actionHost.append(fab);if(analysisTabs)analysisTabs.insertAdjacentElement("afterend",actionHost);else fab.hidden=true;document.body.append(overlay);\nfunction syncFabVisibility(){var inventoryTab=analysisPage&&analysisPage.querySelector('[data-analysis-section="inventory"]');var visible=!!(analysisPage&&!analysisPage.classList.contains("hidden")&&inventoryTab&&inventoryTab.classList.contains("active"));actionHost.hidden=!visible}\ndocument.addEventListener("click",function(e){if(e.target.closest(".tabs button")||e.target.closest(".analysisSubTabs button"))setTimeout(syncFabVisibility,0)},true);syncFabVisibility();'''
          if old not in s: raise SystemExit('OPS10A mount anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          c=Path('ops10a-stocktake.css')
          css=c.read_text(encoding='utf-8')
          start='.ops10a-fab{position:fixed;right:16px;bottom:84px;z-index:950;border:0;border-radius:999px;padding:12px 16px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.18)}'
          repl='.ops10a-action-host{margin-top:12px}.ops10a-action-host[hidden]{display:none}.ops10a-fab{width:100%;border:1px solid #dfe2e6;border-radius:14px;padding:12px 16px;background:#fff;color:#111;font-weight:850;box-shadow:0 4px 14px rgba(0,0,0,.06)}'
          if start not in css: raise SystemExit('OPS10A CSS anchor missing')
          css=css.replace(start,repl,1).replace('.ops10a-fab{right:12px;bottom:76px}','')
          c.write_text(css,encoding='utf-8')
          idx=Path('index.html')
          html=idx.read_text(encoding='utf-8')
          oldv="APP_VERSION='2026.09.16-FINAL.9'"
          newv="APP_VERSION='2026.09.16-FINAL.10'"
          if html.count(oldv)!=1: raise SystemExit('APP_VERSION anchor mismatch')
          idx.write_text(html.replace(oldv,newv,1),encoding='utf-8')
          Path('version.json').write_text('{\n  "version": "2026.09.16-FINAL.10"\n}\n',encoding='utf-8')
      - name: Finite static gates
        shell: bash
        run: |
          set -euo pipefail
          node --check ops10a-stocktake.js
          grep -q 'ops10a-action-host' ops10a-stocktake.js
          grep -q 'data-analysis-section="inventory"' ops10a-stocktake.js
          ! grep -q 'position:fixed;right:16px;bottom:84px' ops10a-stocktake.css
          grep -q "APP_VERSION='2026.09.16-FINAL.10'" index.html
          grep -q '2026.09.16-FINAL.10' version.json
          git diff --check
      - name: Commit and push branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops10a-stocktake.js ops10a-stocktake.css index.html version.json
          git commit -m 'fix: scope OPS10A stocktake to inventory analysis'
          git push origin HEAD:chatgpt/ops10a-ui-fix-20260916
      - name: Close request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'OPS10A_UI_FIX_PASS branch=chatgpt/ops10a-ui-fix-20260916'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed'});
