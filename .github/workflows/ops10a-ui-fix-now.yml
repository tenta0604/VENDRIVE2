name: OPS10A UI fix now
on:
  issues: {types: [opened]}
permissions: {contents: write}
jobs:
  fix:
    if: github.actor == github.repository_owner && github.event.issue.title == '[OPS10A-UI-FIX-NOW]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail; git fetch --tags origin; H=$(git rev-parse HEAD); T=$(git tag --points-at "$H" | grep '^backup-pre-OPS10A-UI-FIX-' | tail -1 || true); test -n "$T"; test "$(git cat-file -t "$T")" = tag; git checkout -b chatgpt/ops10a-ui-fix-20260916
          python - <<'PY'
          from pathlib import Path
          p=Path('ops10a-stocktake.js');s=p.read_text();old='overlay.append(sheet);document.body.append(fab,overlay);';new='''overlay.append(sheet);\nvar analysisPage=document.getElementById("analysisPage"),analysisTabs=analysisPage&&analysisPage.querySelector(".analysisSubTabs");\nvar actionHost=el("div","ops10a-action-host");actionHost.append(fab);if(analysisTabs)analysisTabs.insertAdjacentElement("afterend",actionHost);else fab.hidden=true;document.body.append(overlay);\nfunction syncFabVisibility(){var inventoryTab=analysisPage&&analysisPage.querySelector('[data-analysis-section="inventory"]');var visible=!!(analysisPage&&!analysisPage.classList.contains("hidden")&&inventoryTab&&inventoryTab.classList.contains("active"));actionHost.hidden=!visible}\ndocument.addEventListener("click",function(e){if(e.target.closest(".tabs button")||e.target.closest(".analysisSubTabs button"))setTimeout(syncFabVisibility,0)},true);syncFabVisibility();''';assert old in s;p.write_text(s.replace(old,new,1));c=Path('ops10a-stocktake.css');css=c.read_text();oldcss='.ops10a-fab{position:fixed;right:16px;bottom:84px;z-index:950;border:0;border-radius:999px;padding:12px 16px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.18)}';newcss='.ops10a-action-host{margin-top:12px}.ops10a-action-host[hidden]{display:none}.ops10a-fab{width:100%;border:1px solid #dfe2e6;border-radius:14px;padding:12px 16px;background:#fff;color:#111;font-weight:850;box-shadow:0 4px 14px rgba(0,0,0,.06)}';assert oldcss in css;c.write_text(css.replace(oldcss,newcss,1).replace('.ops10a-fab{right:12px;bottom:76px}',''));idx=Path('index.html');html=idx.read_text();oldv="APP_VERSION='2026.09.16-FINAL.9'";assert html.count(oldv)==1;idx.write_text(html.replace(oldv,"APP_VERSION='2026.09.16-FINAL.10'",1));Path('version.json').write_text('{\n  "version": "2026.09.16-FINAL.10"\n}\n')
          PY
          node --check ops10a-stocktake.js; git diff --check; git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add ops10a-stocktake.js ops10a-stocktake.css index.html version.json;git commit -m 'fix: scope OPS10A stocktake to inventory analysis';git push origin HEAD:chatgpt/ops10a-ui-fix-20260916
