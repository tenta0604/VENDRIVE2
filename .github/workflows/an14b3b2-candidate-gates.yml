name: AN14B3B2 Candidate Gates

on:
  push:
    branches:
      - an14b3b2-real-paper-review-20260915

permissions:
  contents: read

jobs:
  static-and-edge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Static syntax and diff gates
        shell: pwsh
        run: |
          node --check analytics.js
          node --check sales-review.js
          node --check input-recovery-review.js
          node --check ocr-relay-adapter.js
          node --check api/ocr.mjs
          node --check tools/an14b3b2-edge-gate.mjs
          git diff --check 4b60c23d618c7995fcd7cb25bc0dbed20b0f35e2 HEAD

      - name: Real Edge mobile review gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $profile = Join-Path $env:TEMP "vendrive2-an14b3b2-edge"
          if (Test-Path $profile) { Remove-Item -Recurse -Force $profile }
          $server = Start-Process -FilePath "python" -ArgumentList "-m","http.server","8000","--bind","127.0.0.1" -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $edgeCandidates = @(
              "$env:ProgramFiles (x86)\Microsoft\Edge\Application\msedge.exe",
              "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
            )
            $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $edge) { throw "Microsoft Edge not found" }
            $edgeProc = Start-Process -FilePath $edge -ArgumentList "--headless=new","--disable-gpu","--remote-debugging-port=9222","--user-data-dir=$profile","about:blank" -PassThru
            try {
              Start-Sleep -Seconds 2
              node tools/an14b3b2-edge-gate.mjs
            } finally {
              if ($edgeProc -and -not $edgeProc.HasExited) { Stop-Process -Id $edgeProc.Id -Force }
            }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
