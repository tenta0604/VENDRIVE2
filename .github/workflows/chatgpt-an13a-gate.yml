name: AN13A temporary verification

on:
  push:
    branches:
      - chatgpt/an13a-analysis-ui

permissions:
  contents: read

jobs:
  verify-an13a:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify baseline and immutable safety tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '4d895681197c9497d84ae07b445a77d33743d87a'
          $tag = 'backup-pre-AN13A-AN12-20260914'
          git fetch origin main --tags
          $remoteMain = (git rev-parse origin/main).Trim()
          if ($remoteMain -ne $base) { throw "origin/main moved from expected AN13A base: $remoteMain" }
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          if ((git cat-file -t $tag).Trim() -ne 'tag') { throw 'Safety ref is not annotated.' }
          if ((git rev-parse "$tag^{}").Trim() -ne $base) { throw 'Safety tag target mismatch.' }
          Write-Host "AN13A_SAFETY_TAG_PASS"

      - name: Version and state consistency gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Get-Content '.ai/STATE.json' -Raw | ConvertFrom-Json
          $version = Get-Content 'version.json' -Raw | ConvertFrom-Json
          $index = Get-Content 'index.html' -Raw
          $analytics = Get-Content 'analytics.js' -Raw
          $roadmap = Get-Content 'AI_ROADMAP.md' -Raw
          if ($state.completedPhase -ne 'AN13A' -or $state.nextPhase -ne 'AN13B' -or $state.status -ne 'ready') { throw 'STATE phase mismatch.' }
          if ($state.appVersion -ne '2026.09.14-AN13A' -or $state.engineVersion -ne 'AN13A' -or $state.dbVersion -ne 4 -or $state.schemaVersion -ne 4) { throw 'STATE version mismatch.' }
          if ($version.version -ne '2026.09.14-AN13A') { throw 'version.json mismatch.' }
          if ($index -notmatch "APP_VERSION='2026\.09\.14-AN13A'") { throw 'index APP_VERSION mismatch.' }
          if ($analytics -notmatch 'ENGINE_VERSION="AN13A"') { throw 'analytics ENGINE_VERSION mismatch.' }
          if ($roadmap -notmatch 'Latest completed phase: \*\*AN13A — Analysis UI Foundation\*\*') { throw 'ROADMAP completed mismatch.' }
          if ($roadmap -notmatch 'Next phase: \*\*AN13B — Analysis UI Polish / Mobile / Empty-state Hardening\*\*') { throw 'ROADMAP next mismatch.' }
          Write-Host "AN13A_VERSION_STATE_PASS"

      - name: UI contract static gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $index = Get-Content 'index.html' -Raw
          $css = Get-Content 'analytics.css' -Raw
          if (($index | Select-String -Pattern 'data-page="analysisPage"' -AllMatches).Matches.Count -ne 1) { throw 'Analysis main tab count mismatch.' }
          foreach($section in @('proposals','sales','inventory','efficiency')){
            if ($index -notmatch ('data-analysis-section="' + $section + '"')) { throw "Missing analysis section: $section" }
          }
          if ($index -notmatch 'READ ONLY') { throw 'Read-only marker missing.' }
          if ($index -notmatch 'getEndOfDayLoadingProposal\(\{businessEnded:true\}\)') { throw 'Explicit EOD businessEnded action missing.' }
          if ($css -notmatch 'grid-template-columns:repeat\(6,minmax\(0,1fr\)\)') { throw 'Six-tab layout CSS missing.' }
          Write-Host "AN13A_UI_STATIC_PASS"

      - name: Diff check
        shell: pwsh
        run: |
          git diff --check origin/main...HEAD
          Write-Host "AN13A_DIFF_CHECK_PASS"

      - name: JavaScript syntax gates
        shell: pwsh
        run: |
          node --check analytics.js
          @'
          import re, pathlib
          text=pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts=[]
          for m in re.finditer(r"<script([^>]*)>(.*?)</script>", text, re.S|re.I):
              attrs=m.group(1)
              body=m.group(2)
              if "src=" not in attrs.lower() and body.strip():
                  scripts.append(body)
          pathlib.Path("index-inline-check.js").write_text("\n".join(scripts),encoding="utf-8")
          '@ | python -
          node --check index-inline-check.js
          Remove-Item index-inline-check.js
          Write-Host "AN13A_SYNTAX_PASS"

      - name: Real Edge UI and mobile gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $edgeCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe"
          )
          $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw 'Microsoft Edge executable was not found.' }
          $port = 8130
          $server = Start-Process python -ArgumentList @('-m','http.server',"$port",'--bind','127.0.0.1') -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden
          try {
            $ready=$false
            for($attempt=1;$attempt -le 20;$attempt++){
              try{
                $response=Invoke-WebRequest -Uri "http://127.0.0.1:$port/tools/an13a-ui-test.html" -UseBasicParsing -TimeoutSec 2
                if($response.StatusCode -eq 200){$ready=$true;break}
              }catch{Start-Sleep -Milliseconds 500}
            }
            if(-not $ready){throw 'Local AN13A test server did not become ready.'}
            $profile=Join-Path $env:RUNNER_TEMP ("vendrive-an13a-edge-"+$env:GITHUB_RUN_ID)
            $stdout=Join-Path $env:RUNNER_TEMP 'an13a-edge-stdout.txt'
            $stderr=Join-Path $env:RUNNER_TEMP 'an13a-edge-stderr.txt'
            $edgeArgs=@(
              '--headless=new','--disable-gpu','--no-first-run','--no-default-browser-check',
              '--window-size=430,980','--virtual-time-budget=45000',"--user-data-dir=$profile",'--dump-dom',
              "http://127.0.0.1:$port/tools/an13a-ui-test.html"
            )
            $p=Start-Process -FilePath $edge -ArgumentList $edgeArgs -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $text=if(Test-Path $stdout){Get-Content -Raw $stdout}else{''}
            $err=if(Test-Path $stderr){Get-Content -Raw $stderr}else{''}
            Write-Host $text
            if($err){Write-Host "EDGE_STDERR";Write-Host $err}
            if($p.ExitCode -ne 0){throw "Edge exited with code $($p.ExitCode)"}
            if($text -notmatch 'AN13A_UI_PASS'){throw 'AN13A_UI_PASS token not found.'}
            Write-Host "AN13A_REAL_EDGE_UI_PASS"
          }
          finally {
            if($server -and -not $server.HasExited){Stop-Process -Id $server.Id -Force}
          }
