name: Real Workflow Safety Tag

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/real-workflow-safety-tag.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable annotated safety tag
        shell: bash
        env:
          TAG_NAME: backup-pre-OPS-REAL-WORKFLOW-20260916
          TARGET_SHA: e333b11b0ed6488738ab4b4d50082ea84f0287f1
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            existing="$(git rev-list -n 1 "$TAG_NAME")"
            [ "$existing" = "$TARGET_SHA" ] || { echo "tag conflict"; exit 1; }
            exit 0
          fi
          git cat-file -e "$TARGET_SHA^{commit}"
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "Immutable backup before real workflow UX and completion safeguards"
          git push origin "refs/tags/$TAG_NAME"
