name: AN14B3 Gateway Diagnostic

on:
  push:
    branches:
      - chatgpt/an14b3-work-20260914

permissions:
  contents: read

jobs:
  gateway-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Vercel preview redirect
        shell: bash
        run: |
          set -euo pipefail
          sleep 12
          code=$(curl -sS -D headers.txt -o response.txt -w '%{http_code}' \
            -X POST \
            -H 'Origin: https://tenta0604.github.io' \
            https://vendrive2-ocr-relay-git-chatgpt-an14-a1f2b0-nekotokikanjyu-5172.vercel.app/api/ping)
          echo "HTTP $code"
          cat headers.txt
          echo "--- body ---"
          cat response.txt
          echo
