name: MAINT OCR Timeout Gate

on:
  push:
    branches:
      - maint-ocr-timeout-20260915
      - main
    paths:
      - "api/ocr.mjs"
      - "ocr-relay-adapter.js"
      - "index.html"
      - "version.json"
      - ".ai/STATE.json"
      - ".ai/LAST_RUN.json"
      - "tools/maint-ocr-timeout-unit.mjs"
      - "tools/maint-ocr-timeout-production-smoke.mjs"
      - ".github/workflows/maint-ocr-timeout-gate.yml"

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static gates
        run: |
          node --check api/ocr.mjs
          node --check ocr-relay-adapter.js
          node --check tools/maint-ocr-timeout-unit.mjs
          node --check tools/maint-ocr-timeout-production-smoke.mjs
          git diff --check
          grep -q "2026.09.15-FINAL.4" version.json
          grep -q "APP_VERSION='2026.09.15-FINAL.4'" index.html
          grep -q '75000' ocr-relay-adapter.js
          git fetch --tags origin
          test "$(git rev-list -n 1 backup-pre-MAINT-OCR-TIMEOUT-20260915)" = "11ce3764e2aa8b196f63af81399a8c1d014b0583"
      - name: Hedged OCR unit regression
        run: node tools/maint-ocr-timeout-unit.mjs

  production-smoke:
    if: github.ref == 'refs/heads/main'
    needs: static-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for production deployment
        run: sleep 25
      - name: Two realistic large-image production OCR smokes
        run: node tools/maint-ocr-timeout-production-smoke.mjs
