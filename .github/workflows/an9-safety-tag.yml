name: AN9 Safety Tag

on:
  push:
    branches:
      - chatgpt/an9-safety-20260914

permissions:
  contents: write

jobs:
  create-safety-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create or verify immutable annotated safety tag
        shell: bash
        run: |
          set -euo pipefail
          TARGET="adb7ec72ecf4e618e4616859037f45782c36c2ab"
          TAG="backup-pre-AN9-AN8C-20260914"
          git fetch origin --tags --force
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            TYPE="$(git cat-file -t "refs/tags/$TAG")"
            test "$TYPE" = "tag"
            ACTUAL="$(git rev-parse "refs/tags/$TAG^{}")"
            test "$ACTUAL" = "$TARGET"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET" -m "Safety snapshot before AN9"
            git push origin "refs/tags/$TAG"
          fi
          git fetch origin --tags --force
          test "$(git cat-file -t "refs/tags/$TAG")" = "tag"
          test "$(git rev-parse "refs/tags/$TAG^{}")" = "$TARGET"
          echo "AN9 safety tag PASS: $TAG -> $TARGET"
