name: Pinpoint OCR Edit Gate
on:
  push:
    branches:
      - maint-pinpoint-edit-20260915
permissions:
  contents: read
jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static checks
        shell: pwsh
        run: |
          node --check ocr-review-compact.js
          node --check tools/pinpoint-edit-edge-gate.mjs
          git diff --check
          $c=Get-Content ocr-review-compact.js -Raw
          if(-not $c.Contains("OCR確認")){throw "OCR badge missing"}
          if(-not $c.Contains("紐づけ確認")){throw "machine badge missing"}
          if(-not $c.Contains("全体を編集")){throw "full editor action missing"}
          if(-not $c.Contains("aria-label")){throw "pinpoint edit accessibility missing"}
          $i=Get-Content index.html -Raw
          if(-not $i.Contains("APP_VERSION='2026.09.15-FINAL.7'")){throw "version mismatch"}
          git fetch --tags origin
          if((git rev-list -n 1 backup-pre-MAINT-PINPOINT-EDIT-20260915) -ne "efe6bd3ee990a636933d489794cd24fd500eb38e"){throw "safety tag mismatch"}
      - name: Real Edge pinpoint review regression
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $profile=Join-Path $env:TEMP "vendrive2-pinpoint-edge"
          if(Test-Path $profile){Remove-Item -Recurse -Force $profile}
          $server=Start-Process -FilePath "python" -ArgumentList "-m","http.server","8000","--bind","0.0.0.0" -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden
          try{
            Start-Sleep -Seconds 2
            $edgeCandidates=@("$env:ProgramFiles (x86)\Microsoft\Edge\Application\msedge.exe","$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe")
            $edge=$edgeCandidates|Where-Object{Test-Path $_}|Select-Object -First 1
            if(-not $edge){throw "Microsoft Edge not found"}
            $edgeProc=Start-Process -FilePath $edge -ArgumentList "--headless=new","--disable-gpu","--remote-debugging-port=9222","--user-data-dir=$profile","about:blank" -PassThru
            try{Start-Sleep -Seconds 2;node tools/pinpoint-edit-edge-gate.mjs}finally{if($edgeProc -and -not $edgeProc.HasExited){Stop-Process -Id $edgeProc.Id -Force}}
          }finally{if($server -and -not $server.HasExited){Stop-Process -Id $server.Id -Force}}
