name: OPS10B2 guarded executor
on:
  issues: {types: [opened]}
permissions: {contents: write, issues: write}
jobs:
  run:
    if: github.actor == github.repository_owner && github.event.issue.title == '[OPS10B2-EXEC]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          TAG=backup-pre-OPS10B2-EXEC-20260916
          test "$(git cat-file -t "$TAG")" = tag
          EXPECTED="$(git rev-parse "$TAG^{}")"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git checkout -b chatgpt/ops10b2-final16-20260916
          git show 4f82090c844b3cb7ab44dbe3b230d4c2f40b4483:ops10b2-demand-transfer.js > ops10b2-demand-transfer.js
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          needle='<script src="ops10b1-product-intelligence.js'
          assert needle in s and 'ops10b2-demand-transfer.js' not in s
          i=s.index(needle); end=s.index('</script>',i)+9
          s=s[:end]+'\n<script src="ops10b2-demand-transfer.js?v=2026.09.16-FINAL.16"></script>'+s[end:]
          assert s.count("APP_VERSION='2026.09.16-FINAL.15'")==1
          s=s.replace("APP_VERSION='2026.09.16-FINAL.15'","APP_VERSION='2026.09.16-FINAL.16'",1)
          p.write_text(s)
          Path('version.json').write_text('{\n  "version": "2026.09.16-FINAL.16"\n}\n')
          PY
          node --check ops10b2-demand-transfer.js
          git diff --check
          grep -q "status==='confirmed'" ops10b2-demand-transfer.js
          grep -q "causalClaim:false,autoApply:false" ops10b2-demand-transfer.js
          grep -q "requiresUserConfirmation:true,writesLegacyState:false,writesAnalyticsState:false" ops10b2-demand-transfer.js
          grep -q "ops10b2-demand-transfer.js?v=2026.09.16-FINAL.16" index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops10b2-demand-transfer.js index.html version.json
          git commit -m 'feat: add classification-aware demand transfer analysis'
          git push origin HEAD:chatgpt/ops10b2-final16-20260916
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'OPS10B2_EXEC_PASS'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed'});
