name: OPS runtime maintenance
on:
  issues: {types: [opened]}
permissions: {contents: write}
jobs:
  fix:
    if: github.actor == github.repository_owner && github.event.issue.title == '[OPS10B1-RUNTIME-FIX-V2]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          T=backup-pre-OPS10B1-CACHE-FIX-20260916
          test "$(git cat-file -t "$T")" = tag
          test "$(git rev-list -n1 "$T")" = f97eea6e96f5bff4a86983d1884f8bacb7ae4cb9
          git checkout -b chatgpt/ops10b1-runtime-fix-v2-20260916
          python .github/scripts/ops10b1-runtime-fix.py
          git diff --check
          grep -q "APP_VERSION='2026.09.16-FINAL.12'" index.html
          grep -q 'タスクを個別に確認' index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html version.json ocr-config.js
          git commit -m 'fix: integrate OPS10B1 workflow into runtime'
          git push origin HEAD:chatgpt/ops10b1-runtime-fix-v2-20260916
