name: AN14B2 Safety Tag
on:
  push:
    branches: [chatgpt/an14b2-safety-20260914]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          TARGET="d369ee6617395a7f729560e15da6859b8f4d3092"; TAG="backup-pre-AN14B2-AN14B1-20260914"
          git fetch origin --tags --force
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git cat-file -t "refs/tags/$TAG")" = tag
            test "$(git rev-parse "refs/tags/$TAG^{}")" = "$TARGET"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET" -m "Safety snapshot before AN14B2"
            git push origin "refs/tags/$TAG"
          fi
