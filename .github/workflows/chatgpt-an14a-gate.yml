name: AN14A temporary verification

on:
  push:
    branches:
      - chatgpt/an14a-capture-review

permissions:
  contents: read

jobs:
  verify-an14a:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline and immutable safety tag
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='e8b405a0ea6af8a9b5c0d4b558c5e7613426a8d3'
          $tag='backup-pre-AN14A-AN13B-20260914'
          git fetch origin main --tags
          if((git rev-parse origin/main).Trim() -ne $base){throw 'origin/main moved from AN14A base.'}
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          if((git cat-file -t $tag).Trim() -ne 'tag'){throw 'Safety ref is not annotated.'}
          if((git rev-parse "$tag^{}").Trim() -ne $base){throw 'Safety tag target mismatch.'}
          Write-Host 'AN14A_SAFETY_PASS'
      - name: Version and state gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $state=Get-Content '.ai/STATE.json' -Raw|ConvertFrom-Json
          $version=Get-Content 'version.json' -Raw|ConvertFrom-Json
          $index=Get-Content 'index.html' -Raw
          $analytics=Get-Content 'analytics.js' -Raw
          $roadmap=Get-Content 'AI_ROADMAP.md' -Raw
          if($state.completedPhase -ne 'AN14A' -or $state.nextPhase -ne 'AN14B' -or $state.status -ne 'ready'){throw 'STATE phase mismatch.'}
          if($state.appVersion -ne '2026.09.14-AN14A' -or $state.engineVersion -ne 'AN14A' -or $state.dbVersion -ne 4 -or $state.schemaVersion -ne 4){throw 'STATE version mismatch.'}
          if($version.version -ne '2026.09.14-AN14A'){throw 'version mismatch.'}
          if($index -notmatch "APP_VERSION='2026\.09\.14-AN14A'"){throw 'APP_VERSION mismatch.'}
          if($analytics -notmatch 'ENGINE_VERSION="AN14A"'){throw 'ENGINE_VERSION mismatch.'}
          if($roadmap -notmatch 'Latest completed phase: \*\*AN14A — Report Capture / Review Pipeline Foundation\*\*'){throw 'ROADMAP completed mismatch.'}
          if($roadmap -notmatch 'Next phase: \*\*AN14B — Secure OCR Adapter / Classification Integration\*\*'){throw 'ROADMAP next mismatch.'}
          Write-Host 'AN14A_VERSION_STATE_PASS'
      - name: Capture safety static gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $index=Get-Content 'index.html' -Raw
          $analytics=Get-Content 'analytics.js' -Raw
          foreach($token in @('id="reportCapture"','accept="image/*"','capture="environment"','id="reportCaptureModal"','id="prepareReportCaptureReview"')){
            if($index -notmatch [regex]::Escape($token)){throw "Missing capture token: $token"}
          }
          foreach($token in @('Image bytes must not be stored in capture review','AN14A_review_only','reportCreated:false','rawTextStored:false')){
            if($analytics -notmatch [regex]::Escape($token)){throw "Missing capture safety token: $token"}
          }
          Write-Host 'AN14A_CAPTURE_STATIC_PASS'
      - name: Diff check
        shell: pwsh
        run: |
          git diff --check origin/main...HEAD
          Write-Host 'AN14A_DIFF_PASS'
      - name: JavaScript syntax gates
        shell: pwsh
        run: |
          node --check analytics.js
          @'
          import re, pathlib
          text=pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts=[]
          for m in re.finditer(r"<script([^>]*)>(.*?)</script>",text,re.S|re.I):
              if "src=" not in m.group(1).lower() and m.group(2).strip(): scripts.append(m.group(2))
          pathlib.Path("index-inline-check.js").write_text("\n".join(scripts),encoding="utf-8")
          '@ | python -
          node --check index-inline-check.js
          Remove-Item index-inline-check.js
          Write-Host 'AN14A_SYNTAX_PASS'
      - name: Real Edge capture/review gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $edgeCandidates=@("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe","${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe")
          $edge=$edgeCandidates|Where-Object{Test-Path $_}|Select-Object -First 1
          if(-not $edge){throw 'Microsoft Edge not found.'}
          $port=8132
          $server=Start-Process python -ArgumentList @('-m','http.server',"$port",'--bind','127.0.0.1') -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden
          try{
            $ready=$false
            for($attempt=1;$attempt -le 20;$attempt++){
              try{$response=Invoke-WebRequest -Uri "http://127.0.0.1:$port/tools/an14a-capture-test.html" -UseBasicParsing -TimeoutSec 2;if($response.StatusCode -eq 200){$ready=$true;break}}catch{Start-Sleep -Milliseconds 500}
            }
            if(-not $ready){throw 'AN14A test server not ready.'}
            $profile=Join-Path $env:RUNNER_TEMP ("vendrive-an14a-edge-"+$env:GITHUB_RUN_ID)
            $stdout=Join-Path $env:RUNNER_TEMP 'an14a-edge-stdout.txt'
            $stderr=Join-Path $env:RUNNER_TEMP 'an14a-edge-stderr.txt'
            $args=@('--headless=new','--disable-gpu','--no-first-run','--no-default-browser-check','--window-size=430,980','--virtual-time-budget=45000',"--user-data-dir=$profile",'--dump-dom',"http://127.0.0.1:$port/tools/an14a-capture-test.html")
            $p=Start-Process -FilePath $edge -ArgumentList $args -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $text=if(Test-Path $stdout){Get-Content -Raw $stdout}else{''}
            $err=if(Test-Path $stderr){Get-Content -Raw $stderr}else{''}
            Write-Host $text
            if($err){Write-Host 'EDGE_STDERR';Write-Host $err}
            if($p.ExitCode -ne 0){throw "Edge exited with $($p.ExitCode)"}
            if($text -notmatch 'AN14A_CAPTURE_PASS'){throw 'AN14A_CAPTURE_PASS token not found.'}
            Write-Host 'AN14A_REAL_EDGE_PASS'
          }finally{if($server -and -not $server.HasExited){Stop-Process -Id $server.Id -Force}}
