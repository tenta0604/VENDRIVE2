name: FINAL Safety Tag

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/final-safety-tag.yml"

permissions:
  contents: write

jobs:
  create-safety-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create immutable annotated FINAL safety tag
        shell: bash
        env:
          TAG_NAME: backup-pre-FINAL-20260915
          TARGET_SHA: 1f0189c859c489355b5d0dc852fc470f56f5148f
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            existing_target="$(git rev-list -n 1 "$TAG_NAME")"
            if [ "$existing_target" != "$TARGET_SHA" ]; then
              echo "Safety tag already exists at a different commit: $existing_target"
              exit 1
            fi
            echo "Safety tag already exists at expected commit"
            exit 0
          fi
          git cat-file -e "$TARGET_SHA^{commit}"
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "Immutable safety backup before FINAL release regression"
          git push origin "refs/tags/$TAG_NAME"
