name: OPS10B1 FINAL15 rerender repair
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  repair:
    if: github.actor == github.repository_owner && github.event.issue.title == '[MAINTENANCE] OPS10B1-FINAL15-RERENDER-FIX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          TAG=backup-pre-OPS10B1-TODAY-TASK-RERENDER-FIX-20260916
          EXPECTED=40b0b20ca7c87262485ec65f1d51b90de180022f
          test "$(git cat-file -t "$TAG")" = tag
          test "$(git rev-list -n1 "$TAG")" = "$EXPECTED"
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(!$id('todayPage').classList.contains('hidden'))renderToday()"
          new="if(!$id('todayPage').classList.contains('hidden'))renderTodayWithTasks()"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          assert s.count("APP_VERSION='2026.09.16-FINAL.14'")==1
          s=s.replace("APP_VERSION='2026.09.16-FINAL.14'","APP_VERSION='2026.09.16-FINAL.15'",1)
          p.write_text(s,encoding='utf-8')
          vp=Path('version.json')
          v=vp.read_text(encoding='utf-8')
          assert v.count('2026.09.16-FINAL.14')==1
          vp.write_text(v.replace('2026.09.16-FINAL.14','2026.09.16-FINAL.15'),encoding='utf-8')
          PY
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "APP_VERSION='2026.09.16-FINAL.15'" in s
          assert "if(!$id('todayPage').classList.contains('hidden'))renderTodayWithTasks()" in s
          assert "function renderTodayWithTasks(){renderToday();" in s
          assert "querySelectorAll('.swipeRow')" in s
          assert 'id="visitTaskConfirmApply">訪問を完了' in s
          assert 'visitTaskConfirmKeep' not in s
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html version.json
          git commit -m 'fix: preserve Today tasks across position rerenders'
          git push origin HEAD:chatgpt/ops10b1-today-task-rerender-final15-20260916 --force-with-lease
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'MAINTENANCE_PASS: FINAL.15 branch updated; rerender/static gates passed.'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed'});
