name: OCR Stale Warning Gate

on:
  push:
    branches:
      - maint-ocr-stale-warning-20260916
      - main
    paths:
      - "api/ocr.mjs"
      - "index.html"
      - "ocr-review-compact.js"
      - "version.json"
      - ".ai/STATE.json"
      - ".ai/LAST_RUN.json"
      - "tools/ocr-stale-warning-gate.html"
      - "tools/ocr-stale-warning-api-unit.mjs"
      - "tools/ocr-stale-warning-edge-gate.mjs"
      - "tools/ocr-stale-warning-production-smoke.mjs"
      - ".github/workflows/ocr-stale-warning-gate.yml"

permissions:
  contents: read

jobs:
  static-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static and warning normalization
        run: |
          node --check api/ocr.mjs
          node --check ocr-review-compact.js
          node --check tools/ocr-stale-warning-api-unit.mjs
          node --check tools/ocr-stale-warning-edge-gate.mjs
          node --check tools/ocr-stale-warning-production-smoke.mjs
          git diff --check
          grep -q "2026.09.16-FINAL.8" version.json
          grep -q "APP_VERSION='2026.09.16-FINAL.8'" index.html
          grep -q "reportCaptureOcrRunToken" index.html
          git fetch --tags origin
          test "$(git rev-list -n 1 backup-pre-MAINT-OCR-STALE-WARNING-20260916)" = "11bb3fb93a69bd44ef7b5227b41b9fbda80479ce"
      - name: Recovery warning unit regression
        run: node tools/ocr-stale-warning-api-unit.mjs

  real-edge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Real Edge stale result and warning UX
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $profile=Join-Path $env:TEMP "vendrive2-ocr-stale-edge"
          if(Test-Path $profile){Remove-Item -Recurse -Force $profile}
          $server=Start-Process -FilePath "python" -ArgumentList "-m","http.server","8000","--bind","0.0.0.0" -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden
          try{
            Start-Sleep -Seconds 2
            $edgeCandidates=@("$env:ProgramFiles (x86)\Microsoft\Edge\Application\msedge.exe","$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe")
            $edge=$edgeCandidates|Where-Object{Test-Path $_}|Select-Object -First 1
            if(-not $edge){throw "Microsoft Edge not found"}
            $edgeProc=Start-Process -FilePath $edge -ArgumentList "--headless=new","--disable-gpu","--remote-debugging-port=9222","--user-data-dir=$profile","about:blank" -PassThru
            try{Start-Sleep -Seconds 2;node tools/ocr-stale-warning-edge-gate.mjs}finally{if($edgeProc -and -not $edgeProc.HasExited){Stop-Process -Id $edgeProc.Id -Force}}
          }finally{if($server -and -not $server.HasExited){Stop-Process -Id $server.Id -Force}}

  production-smoke:
    if: github.ref == 'refs/heads/main'
    needs: [static-api, real-edge]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for production deployment
        run: sleep 25
      - name: Production OCR smoke
        run: node tools/ocr-stale-warning-production-smoke.mjs
