name: AN14B1 temporary verification
on:
  push:
    branches: [chatgpt/an14b1-ocr-adapter]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Safety
        shell: pwsh
        run: |
          $base='7c25776748b547fed28d847d9fb911a9cb59f7f2';$tag='backup-pre-AN14B1-AN14A-20260914';git fetch origin main --tags
          if((git rev-parse origin/main).Trim() -ne $base){throw 'main moved'}
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          if((git cat-file -t $tag).Trim() -ne 'tag' -or (git rev-parse "$tag^{}").Trim() -ne $base){throw 'safety mismatch'}
      - name: State
        shell: pwsh
        run: |
          $s=Get-Content '.ai/STATE.json' -Raw|ConvertFrom-Json;$v=Get-Content 'version.json' -Raw|ConvertFrom-Json;$a=Get-Content 'analytics.js' -Raw;$i=Get-Content 'index.html' -Raw
          if($s.completedPhase -ne 'AN14B1' -or $s.nextPhase -ne 'AN14B2' -or $s.dbVersion -ne 4 -or $s.schemaVersion -ne 4){throw 'state mismatch'}
          if($v.version -ne '2026.09.14-AN14B1' -or $a -notmatch 'ENGINE_VERSION="AN14B1"' -or $i -notmatch "APP_VERSION='2026\.09\.14-AN14B1'"){throw 'version mismatch'}
      - name: Static security gate
        shell: pwsh
        run: |
          $a=Get-Content 'analytics.js' -Raw;$i=Get-Content 'index.html' -Raw
          foreach($t in @('Unsafe OCR field is not allowed','rawTextStored:false','imageStored:false','AN14B1_review_only')){if($a -notmatch [regex]::Escape($t)){throw "missing $t"}}
          if($i -notmatch 'VENDRIVE2OCRAdapter' -or $i -notmatch 'OCRで読み取る'){throw 'runtime adapter UI missing'}
          if($i -match 'api[_-]?key|sk-[A-Za-z0-9]'){throw 'possible static secret token'}
      - name: Diff and syntax
        shell: pwsh
        run: |
          git diff --check origin/main...HEAD
          node --check analytics.js
          @'
          import re,pathlib
          t=pathlib.Path("index.html").read_text(encoding="utf-8");s=[]
          for m in re.finditer(r"<script([^>]*)>(.*?)</script>",t,re.S|re.I):
              if "src=" not in m.group(1).lower() and m.group(2).strip():s.append(m.group(2))
          pathlib.Path("check.js").write_text("\n".join(s),encoding="utf-8")
          '@ | python -
          node --check check.js
          Remove-Item check.js
      - name: Real Edge
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$edge=@("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe","${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe")|?{Test-Path $_}|select -First 1;if(-not $edge){throw 'Edge missing'}
          $port=8133;$server=Start-Process python -ArgumentList @('-m','http.server',"$port",'--bind','127.0.0.1') -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden
          try{
            Start-Sleep 1;$profile=Join-Path $env:RUNNER_TEMP ("an14b1-"+$env:GITHUB_RUN_ID);$o=Join-Path $env:RUNNER_TEMP 'o.txt';$e=Join-Path $env:RUNNER_TEMP 'e.txt'
            $p=Start-Process $edge -ArgumentList @('--headless=new','--disable-gpu','--no-first-run','--no-default-browser-check','--window-size=430,980','--virtual-time-budget=45000',"--user-data-dir=$profile",'--dump-dom',"http://127.0.0.1:$port/tools/an14b1-test.html") -Wait -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
            $text=Get-Content $o -Raw;Write-Host $text;if($p.ExitCode -ne 0 -or $text -notmatch 'AN14B1_PASS'){if(Test-Path $e){Write-Host (Get-Content $e -Raw)};throw 'AN14B1 Edge failed'}
          }finally{if($server -and -not $server.HasExited){Stop-Process $server.Id -Force}}
