name: FINAL Release Gate

on:
  push:
    branches:
      - final-release-gate-20260915

permissions:
  contents: read

jobs:
  final-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Static, version, safety and diff gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check analytics.js
          node --check sales-review.js
          node --check input-recovery-review.js
          node --check ocr-relay-adapter.js
          node --check api/ocr.mjs
          node --check tools/final-edge-gate.mjs
          git diff --check 1f0189c859c489355b5d0dc852fc470f56f5148f HEAD

          $state = Get-Content .ai/STATE.json -Raw | ConvertFrom-Json
          $last = Get-Content .ai/LAST_RUN.json -Raw | ConvertFrom-Json
          $version = Get-Content version.json -Raw | ConvertFrom-Json
          $index = Get-Content index.html -Raw
          $analytics = Get-Content analytics.js -Raw
          $app = [regex]::Match($index, "APP_VERSION='([^']+)'").Groups[1].Value
          $engine = [regex]::Match($analytics, 'ENGINE_VERSION="([^"]+)"').Groups[1].Value
          $db = [int][regex]::Match($analytics, 'DB_VERSION=(\d+)').Groups[1].Value
          $schema = [int][regex]::Match($analytics, 'SCHEMA_VERSION=(\d+)').Groups[1].Value
          if ($state.completedPhase -ne "AN14B3B2" -or $state.nextPhase -ne "FINAL") { throw "Canonical phase preflight mismatch" }
          if ($last.phase -ne "AN14B3B2" -or $last.status -ne "PASS") { throw "LAST_RUN preflight mismatch" }
          if ($version.version -ne $state.appVersion -or $app -ne $state.appVersion) { throw "APP_VERSION/version.json/STATE mismatch: index=$app version=$($version.version) state=$($state.appVersion)" }
          if ($engine -ne $state.engineVersion -or $db -ne $state.dbVersion -or $schema -ne $state.schemaVersion) { throw "Analytics version preflight mismatch" }

          git fetch --tags origin
          $tagTarget = git rev-list -n 1 backup-pre-FINAL-20260915
          if ($tagTarget -ne "1f0189c859c489355b5d0dc852fc470f56f5148f") { throw "FINAL safety tag target mismatch: $tagTarget" }

      - name: Real Edge full regression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $profile = Join-Path $env:TEMP "vendrive2-final-edge"
          if (Test-Path $profile) { Remove-Item -Recurse -Force $profile }
          $server = Start-Process -FilePath "python" -ArgumentList "-m","http.server","8000","--bind","127.0.0.1" -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $edgeCandidates = @(
              "$env:ProgramFiles (x86)\Microsoft\Edge\Application\msedge.exe",
              "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
            )
            $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $edge) { throw "Microsoft Edge not found" }
            $edgeProc = Start-Process -FilePath $edge -ArgumentList "--headless=new","--disable-gpu","--remote-debugging-port=9222","--user-data-dir=$profile","about:blank" -PassThru
            try {
              Start-Sleep -Seconds 2
              node tools/final-edge-gate.mjs
            } finally {
              if ($edgeProc -and -not $edgeProc.HasExited) { Stop-Process -Id $edgeProc.Id -Force }
            }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
