name: Compact Review Font Safety Tag

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/compact-font-safety-tag.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable annotated safety tag
        shell: bash
        env:
          TAG_NAME: backup-pre-MAINT-COMPACT-FONT-20260915
          TARGET_SHA: de6b74084682364175f19e1124cc4b23807450ce
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            existing="$(git rev-list -n 1 "$TAG_NAME")"
            [ "$existing" = "$TARGET_SHA" ] || { echo "tag conflict"; exit 1; }
            exit 0
          fi
          git cat-file -e "$TARGET_SHA^{commit}"
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "Immutable backup before compact OCR font fix"
          git push origin "refs/tags/$TAG_NAME"
