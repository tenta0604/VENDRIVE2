name: AN14B3A Production OCR Smoke

on:
  push:
    branches:
      - chatgpt/an14b3-work-20260914
    paths:
      - .github/workflows/an14b3a-production-smoke.yml

permissions:
  contents: read

jobs:
  production-ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Validate production real-image structured OCR
        shell: bash
        env:
          FIXTURE_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$FIXTURE_B64" | base64 -d > sales-report.png
          code=$(curl -sS --retry 4 --retry-delay 8 --retry-all-errors -o response.json -w '%{http_code}' \
            -H 'Origin: https://tenta0604.github.io' \
            -F 'file=@sales-report.png;type=image/png' \
            -F 'supportedReportTypes=["sales","input","recovery","input_recovery"]' \
            -F 'makerKey=integration-fixture' \
            -F 'vendorNumber=001' \
            https://vendrive2-ocr-relay.vercel.app/api/ocr)
          echo "HTTP $code"
          cat response.json
          echo
          test "$code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('response.json','utf8'));
          if(x.provider!=='google-gemini-api')throw new Error('provider mismatch');
          if(x.detectedType!=='sales')throw new Error('detectedType mismatch: '+x.detectedType);
          if(!x.candidatePayload||typeof x.candidatePayload!=='object')throw new Error('candidatePayload missing');
          if(x.candidatePayload.totalQty!==3)throw new Error('totalQty mismatch: '+x.candidatePayload.totalQty);
          if(x.candidatePayload.totalAmount!==430)throw new Error('totalAmount mismatch: '+x.candidatePayload.totalAmount);
          if(!Array.isArray(x.candidatePayload.products)||x.candidatePayload.products.length<2)throw new Error('products missing');
          if(!Array.isArray(x.warnings))throw new Error('warnings missing');
          if('rawText' in x||'rawOcrText' in x||'imageData' in x||'base64' in x)throw new Error('unsafe field returned');
          console.log('AN14B3A PRODUCTION REAL IMAGE OCR PASS');
          NODE
