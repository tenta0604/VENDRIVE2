name: Compact Review Font Gate

on:
  push:
    branches:
      - maint-compact-font-20260915

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static checks
        shell: pwsh
        run: |
          node --check ocr-review-compact.js
          node --check tools/compact-font-edge-gate.mjs
          git diff --check
          $compact = Get-Content ocr-review-compact.js -Raw
          if ($compact.Contains('"name",name||')) { throw "generic item name class still present" }
          if (-not $compact.Contains("vdrCompactItemName")) { throw "isolated item class missing" }
          $index = Get-Content index.html -Raw
          if (-not $index.Contains("APP_VERSION='2026.09.15-FINAL.6'")) { throw "version mismatch" }
          git fetch --tags origin
          if ((git rev-list -n 1 backup-pre-MAINT-COMPACT-FONT-20260915) -ne "de6b74084682364175f19e1124cc4b23807450ce") { throw "safety tag mismatch" }
      - name: Real Edge typography regression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $profile = Join-Path $env:TEMP "vendrive2-compact-font-edge"
          if (Test-Path $profile) { Remove-Item -Recurse -Force $profile }
          $server = Start-Process -FilePath "python" -ArgumentList "-m","http.server","8000","--bind","0.0.0.0" -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $edgeCandidates = @("$env:ProgramFiles (x86)\Microsoft\Edge\Application\msedge.exe","$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe")
            $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $edge) { throw "Microsoft Edge not found" }
            $edgeProc = Start-Process -FilePath $edge -ArgumentList "--headless=new","--disable-gpu","--remote-debugging-port=9222","--user-data-dir=$profile","about:blank" -PassThru
            try { Start-Sleep -Seconds 2; node tools/compact-font-edge-gate.mjs }
            finally { if ($edgeProc -and -not $edgeProc.HasExited) { Stop-Process -Id $edgeProc.Id -Force } }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }