name: AN14B3B Sales Review Edge Validation

on:
  push:
    branches:
      - chatgpt/an14b3b-sales-review-20260914b

permissions:
  contents: read

jobs:
  real-edge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lightweight browser driver
        shell: pwsh
        run: npm install --no-save playwright-core@1.55.0
      - name: Syntax check
        shell: pwsh
        run: |
          node --check sales-review.js
      - name: Run sales review flow in real Microsoft Edge
        shell: pwsh
        run: |
          @'
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright-core');
          const root = process.cwd();
          const mime = {'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.json':'application/json; charset=utf-8','.webmanifest':'application/manifest+json'};
          const fixture = {
            provider:'edge-test',
            requestId:'req-an14b3b-1',
            detectedType:'sales',
            typeConfidence:0.99,
            occurredAt:'2026-09-14T09:00:00+09:00',
            makerKey:'coca-cola',
            vendorNumber:'001',
            machineId:null,
            candidatePayload:{
              previousClearAt:'2026-09-13T09:00:00+09:00',
              elapsedHours:24,
              totalQty:2,
              totalAmount:300,
              products:[{productCode:'A001',printedName:'テスト飲料',temperature:null,column:1,price:150,salesQty:2}],
              soldOuts:[],
              specialCircumstance:null
            },
            warnings:[]
          };
          const server = http.createServer((req,res)=>{
            let p = decodeURIComponent(req.url.split('?')[0]);
            if(p==='/'||p==='') p='/index.html';
            const f = path.join(root,p.replace(/^\//,''));
            if(!f.startsWith(root) || !fs.existsSync(f) || fs.statSync(f).isDirectory()){res.writeHead(404);return res.end('not found')}
            res.setHeader('Content-Type',mime[path.extname(f)]||'application/octet-stream');
            res.end(fs.readFileSync(f));
          });
          async function installStub(page){
            await page.evaluate((fixture)=>{
              window.VENDRIVE2OCRAdapter = Object.freeze({
                version:1,
                transport:'test-stub',
                analyze:async()=>JSON.parse(JSON.stringify(fixture))
              });
            }, fixture);
          }
          async function openSalesReview(page){
            const input=page.locator('#reportCaptureFile');
            const png=Buffer.from('89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4890000000d49444154789c6360606060000000050001a5f645400000000049454e44ae426082','hex');
            await input.setInputFiles({name:'sales-journal.png',mimeType:'image/png',buffer:png});
            await page.waitForSelector('#reportCaptureModal.open');
            await installStub(page);
            await page.locator('#runReportOcr').click();
            await page.waitForFunction(()=>document.querySelector('#reportOcrStatus')?.textContent.includes('OCR候補を取得しました'));
            await page.locator('#prepareReportCaptureReview').click();
            await page.waitForSelector('.vdrSalesReview');
          }
          server.listen(4173,'127.0.0.1',async()=>{
            let browser;
            try{
              browser=await chromium.launch({channel:'msedge',headless:true});

              for(const width of [320,390]){
                const context=await browser.newContext({viewport:{width,height:844}});
                const page=await context.newPage();
                const errors=[];
                page.on('pageerror',e=>errors.push(String(e)));
                await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
                await openSalesReview(page);
                const scrollWidth=await page.evaluate(()=>document.documentElement.scrollWidth);
                if(scrollWidth>width+1)throw new Error(`horizontal overflow at ${width}px: ${scrollWidth}`);
                if(await page.locator('.vdrSalesLine').count()<1)throw new Error(`sales line missing at ${width}px`);
                const reviewText=await page.locator('#reportCaptureReviewResult').innerText();
                const productName=await page.locator('.vdrSalesField').filter({has:page.locator('label').filter({hasText:/^商品名$/})}).locator('input').first().inputValue();
                if(!reviewText.includes('売上ジャーナル照合')||productName!=='テスト飲料')throw new Error(`review content missing at ${width}px`);
                if(errors.length)throw new Error(`page errors at ${width}px: ${errors.join(' | ')}`);
                await context.close();
              }

              const context=await browser.newContext({viewport:{width:390,height:844}});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              await openSalesReview(page);

              const validation=page.locator('.vdrSalesValidation');
              await page.waitForFunction(()=>document.querySelector('.vdrSalesValidation')?.textContent.includes('照合OK'));
              const save=page.locator('.vdrSalesSave');
              if(!(await save.isDisabled()))throw new Error('save must be disabled before explicit paper approval');

              const salesQtyField=page.locator('.vdrSalesField').filter({has:page.locator('label').filter({hasText:/^売上数$/})}).locator('input').first();
              await salesQtyField.fill('1');
              await page.waitForFunction(()=>document.querySelector('.vdrSalesValidation')?.textContent.includes('要確認'));

              const totalQtyField=page.locator('.vdrSalesField').filter({has:page.locator('label').filter({hasText:/^売上数合計$/})}).locator('input').first();
              const totalAmountField=page.locator('.vdrSalesField').filter({has:page.locator('label').filter({hasText:/^売上金額$/})}).locator('input').first();
              await totalQtyField.fill('1');
              await totalAmountField.fill('150');
              await page.waitForFunction(()=>document.querySelector('.vdrSalesValidation')?.textContent.includes('照合OK'));

              const legacyBefore=await page.evaluate(()=>localStorage.getItem('vendrive2_v7_data'));
              await page.locator('.vdrSalesApproval input').check();
              if(await save.isDisabled())throw new Error('save should enable only after validation and explicit approval');
              await save.click();
              await page.waitForFunction(()=>document.querySelector('.vdrSalesStatus:last-child')?.textContent.includes('下書きを作成しました'));

              const evidence=await page.evaluate(async()=>{
                const reports=await window.VENDRIVE2Analytics.reports.list();
                const inventory=await window.VENDRIVE2Analytics.inventory.listEvents();
                return {
                  reports:reports.map(r=>({status:r.status,type:r.type,source:r.source&&r.source.method,current:r.current})),
                  inventoryCount:inventory.length,
                  legacy:localStorage.getItem('vendrive2_v7_data')
                };
              });
              if(evidence.reports.length!==1)throw new Error(`expected one draft report, got ${evidence.reports.length}`);
              if(evidence.reports[0].status!=='draft'||evidence.reports[0].type!=='sales'||evidence.reports[0].source!=='ocr')throw new Error('draft report boundary mismatch');
              if(evidence.reports[0].current.totalQty!==1||evidence.reports[0].current.totalAmount!==150)throw new Error('edited sales values were not persisted to draft');
              if(evidence.inventoryCount!==0)throw new Error('inventory movement must remain zero');
              if(evidence.legacy!==legacyBefore)throw new Error('legacy state changed during OCR review/draft creation');
              const finalWidth=await page.evaluate(()=>document.documentElement.scrollWidth);
              if(finalWidth>391)throw new Error(`horizontal overflow after draft creation: ${finalWidth}`);
              if(errors.length)throw new Error(errors.join(' | '));
              console.log('AN14B3B_EDGE_PASS',JSON.stringify({viewports:[320,390],fieldEdit:true,explicitApproval:true,draftOnly:true,inventoryMovement:false,legacyWrite:false}));
              await context.close();
            }catch(e){
              console.error(e);
              process.exitCode=1;
            }finally{
              if(browser)await browser.close();
              server.close();
            }
          });
          '@ | Set-Content -Encoding utf8 .tmp-an14b3b-edge.cjs
          node .tmp-an14b3b-edge.cjs
