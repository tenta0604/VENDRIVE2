name: AN14B3 Work Validation

on:
  push:
    branches:
      - chatgpt/an14b3-work-20260914

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire relay adapter into capture page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="analytics.js"></script>'
          new='<script src="ocr-config.js"></script>\n<script src="ocr-relay-adapter.js"></script>\n<script src="analytics.js"></script>'
          if new not in s:
              if old not in s:
                  raise SystemExit('analytics script marker not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax and static safety checks
        shell: bash
        run: |
          set -euo pipefail
          node --check analytics.js
          node --check ocr-config.js
          node --check ocr-relay-adapter.js
          node --check api/ocr.mjs
          grep -F '<script src="ocr-config.js"></script>' index.html
          grep -F '<script src="ocr-relay-adapter.js"></script>' index.html
          ! grep -REn '(sk-proj-|OPENAI_API_KEY[[:space:]]*=|api[_-]?key[[:space:]]*[:=][[:space:]]*["'\'' ][A-Za-z0-9_-]{16,})' -- index.html analytics.js ocr-config.js ocr-relay-adapter.js api/ocr.mjs
          git diff --check
      - name: Adapter behavior checks
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('ocr-relay-adapter.js','utf8');
          function context(endpoint){
            let calls=0;
            const ctx={console,URL,Blob,FormData,AbortController,setTimeout,clearTimeout,window:{location:{href:'https://tenta0604.github.io/VENDRIVE2/'},VENDRIVE2OCRRelayConfig:{version:1,endpoint}},fetch:async()=>{calls++;throw new Error('network should not be reached in static test')}};
            vm.createContext(ctx);vm.runInContext(code,ctx);return {ctx,calls:()=>calls};
          }
          let a=context('');if(a.ctx.window.VENDRIVE2OCRAdapter)throw new Error('adapter must stay disabled without endpoint');
          let b=context('http://example.com/ocr');if(b.ctx.window.VENDRIVE2OCRAdapter)throw new Error('insecure remote endpoint must be rejected');
          let c=context('https://ocr.example.com/api');if(!c.ctx.window.VENDRIVE2OCRAdapter||c.ctx.window.VENDRIVE2OCRAdapter.version!==1)throw new Error('https relay adapter should install');
          if(c.ctx.window.VENDRIVE2OCRAdapter.maxUploadBytes!==4*1024*1024)throw new Error('relay upload limit mismatch');
          c.ctx.window.VENDRIVE2OCRAdapter.analyze({file:new Blob(['x'],{type:'text/plain'}),supportedReportTypes:['sales']}).then(()=>{throw new Error('non-image accepted')}).catch(e=>{if(!/image/.test(String(e.message)))throw e});
          NODE
      - name: Relay behavior checks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const mod=await import('./api/ocr.mjs');
          const handler=mod.default.fetch;
          let r=await handler(new Request('https://relay.example/api/ocr',{method:'POST',headers:{origin:'https://evil.example'}}));
          if(r.status!==403)throw new Error('unapproved origin was not rejected');
          r=await handler(new Request('https://relay.example/api/ocr',{method:'GET',headers:{origin:'https://tenta0604.github.io'}}));
          if(r.status!==405)throw new Error('non-POST request was not rejected');
          delete process.env.OPENAI_API_KEY;
          r=await handler(new Request('https://relay.example/api/ocr',{method:'POST',headers:{origin:'https://tenta0604.github.io'}}));
          if(r.status!==503)throw new Error('missing secret was not fail-closed');
          NODE
      - name: Commit work branch patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: wire secure OCR relay adapter"
          git push origin HEAD

  real-edge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        shell: pwsh
        run: npm install --no-save playwright-core@1.55.0
      - name: Validate in Microsoft Edge
        shell: pwsh
        run: |
          @'
          const http=require('http'),fs=require('fs'),path=require('path');
          const {chromium}=require('playwright-core');
          const root=process.cwd(),mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.json':'application/json; charset=utf-8','.webmanifest':'application/manifest+json'};
          const server=http.createServer((req,res)=>{let p=decodeURIComponent(req.url.split('?')[0]);if(p==='/'||p==='')p='/index.html';const f=path.join(root,p.replace(/^\//,''));if(!f.startsWith(root)||!fs.existsSync(f)||fs.statSync(f).isDirectory()){res.writeHead(404);return res.end('not found')}res.setHeader('Content-Type',mime[path.extname(f)]||'application/octet-stream');res.end(fs.readFileSync(f))});
          server.listen(4173,'127.0.0.1',async()=>{let browser;try{browser=await chromium.launch({channel:'msedge',headless:true});for(const width of [320,390]){const context=await browser.newContext({viewport:{width,height:844}}),page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e)));await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});const tabs=await page.locator('.tabs button').count();if(tabs<6)throw new Error(`expected >=6 tabs at ${width}px, got ${tabs}`);const bodyWidth=await page.evaluate(()=>document.documentElement.scrollWidth);if(bodyWidth>width+1)throw new Error(`horizontal overflow at ${width}px: ${bodyWidth}`);if(errors.length)throw new Error(`page errors at ${width}px: ${errors.join(' | ')}`);await context.close()}
          const context=await browser.newContext({viewport:{width:390,height:844}});await context.addInitScript(()=>{window.VENDRIVE2OCRAdapter=Object.freeze({version:1,transport:'test-stub',analyze:async()=>({provider:'edge-test',requestId:'req-edge-1',detectedType:'sales',typeConfidence:.98,occurredAt:'2026-09-14T09:00:00+09:00',makerKey:'test-maker',vendorNumber:'001',machineId:null,candidatePayload:{previousClearAt:'2026-09-13T09:00:00+09:00',elapsedHours:24,totalQty:2,totalAmount:300,products:[{productCode:'A',printedName:'A',temperature:null,column:1,price:150,salesQty:2}],soldOuts:[],specialCircumstance:null},warnings:[]})})});const page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e)));await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});const png=Buffer.from('89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4890000000d49444154789c6360606060000000050001a5f645400000000049454e44ae426082','hex');await page.locator('#reportCaptureFile').setInputFiles({name:'edge-test.png',mimeType:'image/png',buffer:png});await page.waitForSelector('#reportCaptureModal.open');await page.locator('#runReportOcr').click();await page.waitForFunction(()=>document.querySelector('#reportOcrStatus')?.textContent.includes('OCR候補を取得しました'));const text=await page.locator('#reportOcrResult').innerText();if(!text.includes('売上')||!text.includes('98%'))throw new Error('OCR review summary missing expected values');if(errors.length)throw new Error(errors.join(' | '));console.log('EDGE_PASS',JSON.stringify({viewports:[320,390],ocrReview:true}));await context.close()}catch(e){console.error(e);process.exitCode=1}finally{if(browser)await browser.close();server.close()}});
          '@ | Set-Content -Encoding utf8 .tmp-an14b3-edge.cjs
          node .tmp-an14b3-edge.cjs
