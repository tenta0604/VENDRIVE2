name: OPS10A wire stocktake assets
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  wire:
    if: github.event.issue.user.login == github.repository_owner && github.event.issue.title == '[OPS10A-WIRE] stocktake assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ops10a-vehicle-stocktake-20260916
          fetch-depth: 0
      - name: Wire assets and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="ops10a-stocktake.css">'
          js='<script src="ops10a-stocktake.js"></script>'
          if css not in s:
              marker='</head>'
              if marker not in s: raise SystemExit('SAFE STOP: </head> not found')
              s=s.replace(marker,css+'\n'+marker,1)
          if js not in s:
              marker='</body>'
              if marker not in s: raise SystemExit('SAFE STOP: </body> not found')
              s=s.replace(marker,js+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check ops10a-stocktake.js
          grep -F 'ops10a-stocktake.css' index.html
          grep -F 'ops10a-stocktake.js' index.html
          git diff --check
          git config user.name 'VENDRIVE OPS Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && { echo 'SAFE STOP: no wiring change'; exit 1; }
          git commit -m 'feat: wire OPS10A stocktake UI'
          git push origin HEAD:chatgpt/ops10a-vehicle-stocktake-20260916
      - name: Close request
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'OPS10A_WIRE_PASS'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed',state_reason:'completed'});
