name: MAINT Empty Start Gate

on:
  push:
    branches:
      - maint-empty-start-20260915

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static scope gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check tools/maint-empty-start-gate.mjs
          git diff --check 935bd710be85f87d972c786daee5d773ab23c9e1 HEAD
          $index = Get-Content index.html -Raw
          if ($index.Contains("initializeSampleData")) { throw "sample initializer still exists" }
          if ($index.Contains("name:'自販機 A'")) { throw "sample machine fixture still exists" }
          if (-not $index.Contains("APP_VERSION='2026.09.15-FINAL.2'")) { throw "maintenance version missing" }
          $version = Get-Content version.json -Raw | ConvertFrom-Json
          $state = Get-Content .ai/STATE.json -Raw | ConvertFrom-Json
          if ($version.version -ne "2026.09.15-FINAL.2" -or $state.appVersion -ne "2026.09.15-FINAL.2") { throw "version metadata mismatch" }
          git fetch --tags origin
          $tagTarget = git rev-list -n 1 backup-pre-MAINT-EMPTY-START-20260915
          if ($tagTarget -ne "17e653bffbafd210e24cdf68293a4ce976ebc01e") { throw "safety tag target mismatch" }
      - name: Real Edge startup regression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $profile = Join-Path $env:TEMP "vendrive2-empty-start-edge"
          if (Test-Path $profile) { Remove-Item -Recurse -Force $profile }
          $server = Start-Process -FilePath "python" -ArgumentList "-m","http.server","8000","--bind","0.0.0.0" -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $edgeCandidates = @(
              "$env:ProgramFiles (x86)\Microsoft\Edge\Application\msedge.exe",
              "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
            )
            $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $edge) { throw "Microsoft Edge not found" }
            $edgeProc = Start-Process -FilePath $edge -ArgumentList "--headless=new","--disable-gpu","--remote-debugging-port=9222","--user-data-dir=$profile","about:blank" -PassThru
            try {
              Start-Sleep -Seconds 2
              node tools/maint-empty-start-gate.mjs
            } finally {
              if ($edgeProc -and -not $edgeProc.HasExited) { Stop-Process -Id $edgeProc.Id -Force }
            }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
