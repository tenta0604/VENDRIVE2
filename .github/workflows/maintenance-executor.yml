name: Guarded maintenance executor
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  maintenance:
    if: github.actor == github.repository_owner && github.event.issue.title == '[MAINTENANCE] OPS10B1-CACHE-FIX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          BASE=$(git rev-parse HEAD)
          TAG=backup-pre-OPS10B1-CACHE-FIX-20260916
          test "$(git cat-file -t "$TAG")" = tag
          test "$(git rev-list -n1 "$TAG")" = "f97eea6e96f5bff4a86983d1884f8bacb7ae4cb9"
          git checkout -b chatgpt/ops10b1-cache-fix-20260916
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old="var STORAGE_VERSION=1,APP_VERSION='2026.09.16-FINAL.10',BACKUP_FORMAT_VERSION=1";new="var STORAGE_VERSION=1,APP_VERSION='2026.09.16-FINAL.12',BACKUP_FORMAT_VERSION=1"
          assert s.count(old)==1;s=s.replace(old,new,1)
          start=s.index('function renderTodayWithTasks(){');end=s.index('\n\nfunction initDays(){',start)
          replacement=r'''function ensureVisitTaskConfirmModal(){var modal=$id('visitTaskConfirmModal');if(modal)return modal;modal=document.createElement('div');modal.id='visitTaskConfirmModal';modal.className='modal';modal.innerHTML='<div class="sheet"><div class="modalTop"><div><div class="ey">VISIT CHECK</div><div class="title">タスクを個別に確認</div></div><button class="pill" id="visitTaskConfirmClose">閉じる</button></div><div class="notice">この訪問で完了したタスクだけチェックしてください。未チェックは未完了のまま残ります。</div><div id="visitTaskConfirmList"></div><div class="actions"><button class="secondary" id="visitTaskConfirmKeep">未完了を残して訪問完了</button><button class="primary" id="visitTaskConfirmApply">チェックを反映して訪問完了</button></div></div>';document.body.appendChild(modal);$id('visitTaskConfirmClose').onclick=function(){closeModal('visitTaskConfirmModal')};return modal}
function continueVisitAfterTaskCheck(machine){selectedMachine=machine;if(machine.order){$id('orderVisitConfirmDetail').textContent=machine.order.type+(machine.order.sub?' ＞ '+machine.order.sub:'');closeModal('machineModal');openModal('orderVisitConfirm');return true}finishVisitCore();return true}
function openVisitTaskConfirm(machine){ensureVisitTaskConfirmModal();var box=$id('visitTaskConfirmList'),tasks=activeTasksForMachine(machine);box.innerHTML='';tasks.forEach(function(task){var p=taskProgress(task),row=document.createElement('label');row.style.cssText='display:flex;gap:10px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid #eee';row.innerHTML='<input type="checkbox" data-task-id="'+esc(task.id)+'" style="width:20px;height:20px"><span><b>'+esc(task.text||'タスク')+'</b><small style="display:block;color:#777;margin-top:3px">全体進捗 '+p.done+' / '+p.total+'台</small></span>';box.appendChild(row)});function apply(useChecks){var checked={};if(useChecks)box.querySelectorAll('input:checked').forEach(function(input){checked[input.dataset.taskId]=true});tasks.forEach(function(task){if(!checked[task.id])return;if(!machine.taskDone||typeof machine.taskDone!=='object')machine.taskDone={};machine.taskDone[task.id]={completedAt:Date.now()};completeParentTaskIfDone(task)});persist();closeModal('visitTaskConfirmModal');renderAll();continueVisitAfterTaskCheck(machine)}$id('visitTaskConfirmKeep').onclick=function(){apply(false)};$id('visitTaskConfirmApply').onclick=function(){apply(true)};openModal('visitTaskConfirmModal')}
function completeVisit(){if(!selectedMachine)return false;var tasks=activeTasksForMachine(selectedMachine);if(tasks.length){openVisitTaskConfirm(selectedMachine);return false}return continueVisitAfterTaskCheck(selectedMachine)}
function renderTodayWithTasks(){renderToday();var old=$id('todayTaskBlock');if(old)old.remove();var machines=sortedTodayMachines(targets(todayDay,false)),cards=Array.prototype.slice.call($id('todayList').querySelectorAll('.swipeCard'));cards.forEach(function(card,index){var machine=machines[index];if(!machine)return;var prior=card.querySelector('.todayMachineTasks');if(prior)prior.remove();var tasks=activeTasksForMachine(machine);if(!tasks.length)return;var wrap=document.createElement('div');wrap.className='todayMachineTasks';wrap.style.cssText='margin-top:9px;padding-top:8px;border-top:1px solid #eceef0';var head=document.createElement('div');head.style.cssText='display:flex;justify-content:space-between;font-size:9px;font-weight:900';head.innerHTML='<span style="color:#b42318">TASK</span><span>'+tasks.length+'件</span>';wrap.appendChild(head);tasks.slice(0,2).forEach(function(task){var p=taskProgress(task),row=document.createElement('div');row.style.cssText='display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:10px';row.innerHTML='<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800">'+esc(task.text||'タスク')+'</span><strong style="font-size:9px;color:#666;white-space:nowrap">'+p.done+' / '+p.total+'台</strong>';wrap.appendChild(row)});if(tasks.length>2){var more=document.createElement('div');more.style.cssText='font-size:9px;color:#777;font-weight:850';more.textContent='＋'+(tasks.length-2)+'件';wrap.appendChild(more)}card.appendChild(wrap)})}'''
          s=s[:start]+replacement+s[end:];p.write_text(s)
          Path('version.json').write_text('{\n  "version": "2026.09.16-FINAL.12"\n}\n')
          Path('ocr-config.js').write_text('(function(){"use strict";var existing=window.VENDRIVE2OCRRelayConfig;if(!existing||typeof existing!=="object")window.VENDRIVE2OCRRelayConfig=Object.freeze({version:1,endpoint:"https://vendrive2-ocr-relay.vercel.app/api/ocr"});})();\n')
          PY
          git diff --check
          grep -q "APP_VERSION='2026.09.16-FINAL.12'" index.html
          grep -q 'タスクを個別に確認' index.html
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html version.json ocr-config.js;git commit -m 'fix: integrate OPS10B1 workflow into app runtime';git push origin HEAD:chatgpt/ops10b1-cache-fix-20260916
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'MAINTENANCE_PASS: OPS10B1 runtime integration branch created and verified.'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed'});