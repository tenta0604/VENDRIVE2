name: Guarded maintenance executor
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  maintenance:
    if: github.actor == github.repository_owner && (github.event.issue.title == '[MAINTENANCE] OPS10B1-CACHE-FIX' || github.event.issue.title == '[MAINTENANCE] OPS10B1-DEVICE-FIX')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if [ "${{ github.event.issue.title }}" = "[MAINTENANCE] OPS10B1-DEVICE-FIX" ]; then
            TAG=backup-pre-OPS10B1-DEVICE-FIX-20260916
            EXPECTED=05a8f86dab4110d5f6b7abf5c0bf10cfeba2430f
            test "$(git cat-file -t "$TAG")" = tag
            test "$(git rev-list -n1 "$TAG")" = "$EXPECTED"
            python .github/scripts/ops10b1-device-fix.py
            git diff --check
            grep -q "APP_VERSION='2026.09.16-FINAL.13'" index.html
            grep -q 'id="visitTaskConfirmApply">訪問を完了' index.html
            ! grep -q 'visitTaskConfirmKeep' index.html
            grep -q 'tasks.forEach(function(task)' index.html
            grep -q 'querySelectorAll(.swipeWrap.)' index.html
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add index.html version.json
            git commit -m 'fix: stabilize Today task workflow on device'
            git push origin HEAD:chatgpt/ops10b1-device-runtime-20260916
          else
            echo 'Legacy cache-fix trigger retained for compatibility; no-op because FINAL.12 is already integrated.'
          fi
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'MAINTENANCE_PASS: guarded maintenance completed and verified.'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed'});
