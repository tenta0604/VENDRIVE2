<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AN8B_BROWSER_RUNNING</title></head>
<body>
<pre id="result">AN8B_BROWSER_RUNNING</pre>
<script src="../analytics.js"></script>
<script type="module">
const result=document.getElementById("result");
const api=window.VENDRIVE2Analytics;
function payload(observedAt,qty){
  const previousClearAt=new Date(Date.parse(observedAt)-86400000).toISOString();
  return {
    previousClearAt,
    elapsedHours:24,
    totalQty:qty,
    totalAmount:qty*100,
    products:[{productCode:"P1",printedName:"Product 1",temperature:"HOT",column:1,price:100,salesQty:qty}],
    soldOuts:[],
    specialCircumstance:null
  };
}
async function addReport(id,observedAt,qty){
  const current=payload(observedAt,qty);
  await api.data.reports.create({
    id,
    type:"sales",
    machineId:"M1",
    makerKey:"MK",
    vendorNumber:"1",
    occurredAt:observedAt,
    original:current,
    current:current,
    source:{method:"manual",imageStored:false}
  });
  const confirmed=await api.data.reports.confirm(id);
  if(!confirmed.confirmed)throw new Error("Report did not confirm: "+id);
}
try{
  await api.ready();
  const rows=[
    ["h1","2025-09-11T00:00:00+09:00",5],
    ["h2","2025-09-12T00:00:00+09:00",5],
    ["h3","2025-09-13T00:00:00+09:00",5],
    ["c1","2026-09-12T00:00:00+09:00",10],
    ["c2","2026-09-13T00:00:00+09:00",10],
    ["c3","2026-09-14T00:00:00+09:00",10]
  ];
  for(const row of rows)await addReport(row[0],row[1],row[2]);
  const filter={machineId:"M1",makerKey:"MK",vendorNumber:"1",productCode:"P1",windowSize:3,yearsBack:1,timeZone:"Asia/Tokyo",maxDayDistance:7};
  const comparisons=await api.analysis.sales.listHistoricalComparisons(filter);
  const target=comparisons.find(x=>x.current.windowEndAt==="2026-09-14T00:00:00+09:00");
  if(!target)throw new Error("Target historical comparison was not produced.");
  if(target.historical.windowEndAt!=="2025-09-13T00:00:00+09:00")throw new Error("Nearest historical window mismatch.");
  if(target.calendarMatch!=="nearest_date"||target.dayOffset!==-1||target.dayDistance!==1)throw new Error("Calendar distance metadata mismatch.");
  if(target.historicalObservedUnitsPerDay!==5||target.currentObservedUnitsPerDay!==10||target.observedUnitsPerDayChange!==5||target.observedUnitsPerDayChangeRatio!==1)throw new Error("Rate comparison mismatch.");
  const exactOnly=await api.analysis.sales.listHistoricalComparisons({...filter,maxDayDistance:0});
  if(exactOnly.some(x=>x.current.windowEndAt==="2026-09-14T00:00:00+09:00"))throw new Error("maxDayDistance=0 allowed a non-exact match.");

  async function addMachineReport(id,machineId,observedAt,qty){
    const current=payload(observedAt,qty);
    await api.data.reports.create({
      id,
      type:"sales",
      machineId,
      makerKey:"MK",
      vendorNumber:"2",
      occurredAt:observedAt,
      original:current,
      current:current,
      source:{method:"manual",imageStored:false}
    });
    const confirmed=await api.data.reports.confirm(id);
    if(!confirmed.confirmed)throw new Error("Cross-year report did not confirm: "+id);
  }
  const crossYearRows=[
    ["yh1","M2","2024-12-29T00:00:00+09:00",4],
    ["yh2","M2","2024-12-30T00:00:00+09:00",4],
    ["yh3","M2","2024-12-31T00:00:00+09:00",4],
    ["yc1","M2","2026-01-01T00:00:00+09:00",8],
    ["yc2","M2","2026-01-02T00:00:00+09:00",8],
    ["yc3","M2","2026-01-03T00:00:00+09:00",8]
  ];
  for(const row of crossYearRows)await addMachineReport(row[0],row[1],row[2],row[3]);
  const crossYear=await api.analysis.sales.listHistoricalComparisons({machineId:"M2",makerKey:"MK",vendorNumber:"2",productCode:"P1",windowSize:3,yearsBack:1,timeZone:"Asia/Tokyo",maxDayDistance:7});
  const crossTarget=crossYear.find(x=>x.current.windowEndAt==="2026-01-03T00:00:00+09:00");
  if(!crossTarget)throw new Error("Cross-year historical comparison was not produced.");
  if(crossTarget.historical.windowEndAt!=="2024-12-31T00:00:00+09:00"||crossTarget.dayOffset!==-3||crossTarget.dayDistance!==3)throw new Error("Cross-year nearest historical match mismatch.");

  if(typeof api.analysis.sales.listPreviousPeriodComparisons!=="function")throw new Error("AN8A3 API regressed.");
  const evidence={comparisonCount:comparisons.length,target:{historicalEndAt:target.historical.windowEndAt,currentEndAt:target.current.windowEndAt,calendarMatch:target.calendarMatch,dayOffset:target.dayOffset,dayDistance:target.dayDistance,historicalUnitsPerDay:target.historicalObservedUnitsPerDay,currentUnitsPerDay:target.currentObservedUnitsPerDay,change:target.observedUnitsPerDayChange,ratio:target.observedUnitsPerDayChangeRatio},crossYear:{historicalEndAt:crossTarget.historical.windowEndAt,currentEndAt:crossTarget.current.windowEndAt,dayOffset:crossTarget.dayOffset,dayDistance:crossTarget.dayDistance}};
  result.textContent="AN8B_BROWSER_PASS\n"+JSON.stringify(evidence);
  document.title="AN8B_BROWSER_PASS";
  document.documentElement.dataset.test="pass";
}catch(error){
  result.textContent="AN8B_BROWSER_FAIL\n"+String(error&&error.stack||error);
  document.title="AN8B_BROWSER_FAIL";
  document.documentElement.dataset.test="fail";
}
</script>
</body>
</html>
