<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;padding:0;font-family:Arial,sans-serif}body{padding:8px}#review{max-width:720px;margin:auto}</style>
<script>
window.__capturedUpload=null;window.__progress=[];window.__linkWrites=0;
window.VENDRIVE2OCRRelayConfig={version:1,endpoint:"https://example.test/api/ocr"};
window.fetch=async function(url,options){
  if(String(url).indexOf("example.test/api/ocr")>=0){
    var file=options.body.get("file"),bm=await createImageBitmap(file);
    window.__capturedUpload={size:file.size,type:file.type,width:bm.width,height:bm.height};try{bm.close()}catch(e){}
    return new Response(JSON.stringify({provider:"google-gemini-api",requestId:"browser-fixture",detectedType:"input",typeConfidence:1,occurredAt:"2026-09-15T08:38:00+09:00",makerKey:"suntory",vendorNumber:"4038404",machineId:null,candidatePayload:{paper:{carNumber:"404",operatorName:"大岩 忍",locationName:"第一フジタクシー大治"},totalQty:3,items:[{productCode:"705904",printedName:"185ボス",temperature:"COLD",column:null,quantity:1},{productCode:"705906",printedName:"185ボス2",temperature:"COLD",column:null,quantity:2}]},warnings:[]}),{status:200,headers:{"Content-Type":"application/json"}});
  }
  throw new Error("unexpected fetch "+url);
};
window.VENDRIVE2Analytics={
  data:{
    reports:{validatePayload:function(type,occurredAt,payload){
      function good(x){return x&&Array.isArray(x.items)&&Number.isInteger(x.totalQty)&&x.items.reduce(function(n,i){return n+(Number.isInteger(i.quantity)?i.quantity:0)},0)===x.totalQty}
      var ok=!!occurredAt;
      if(type==="input")ok=ok&&good(payload);
      else if(type==="recovery")ok=ok&&good(payload);
      else if(type==="input_recovery")ok=ok&&good(payload.input)&&good(payload.recovery);
      else if(type==="sales"){var q=payload.products.reduce(function(n,i){return n+i.salesQty},0),a=payload.products.reduce(function(n,i){return n+i.salesQty*i.price},0);ok=ok&&q===payload.totalQty&&a===payload.totalAmount}
      return {readyToConfirm:ok,validation:{quantityMatch:ok,amountMatch:ok,warnings:[]}};
    }},
    machineLinks:{put:function(){window.__linkWrites++;return Promise.resolve({})}
    }
  },
  bridge:{findMachineCandidates:function(){return Promise.resolve({status:"confirmed_mapping",requiresUserConfirmation:false,confirmedMapping:{machineId:"M1",missing:false},candidates:[{machineId:"M1",sources:["confirmed_mapping"],makerMatch:true,managementCodeMatch:true,machine:{id:"M1",name:"第一フジタクシー大治",managementCodeKey:"4038404"}}]})}},
  capture:{createDraftFromReview:function(){return Promise.resolve({report:{id:"draft:test"}})}}
};
</script>
</head><body><div id="review"></div>
<script src="../ocr-relay-adapter.js"></script>
<script src="../sales-review.js"></script>
<script src="../input-recovery-review.js"></script>
<script src="../ocr-review-compact.js"></script>
</body></html>
