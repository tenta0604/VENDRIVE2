<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCR continuation vendor gate</title><style>html,body{margin:0;width:320px;max-width:320px}body{overflow-x:hidden}</style></head>
<body><pre id="out">RUNNING</pre>
<script src="../analytics.js"></script>
<script>
(async function(){
  const out=document.getElementById("out"),api=window.VENDRIVE2Analytics;
  const assert=(v,m)=>{if(!v)throw new Error(m)};
  api.close();
  await new Promise((resolve,reject)=>{const q=indexedDB.deleteDatabase("VENDRIVE2_ANALYTICS_DB");q.onsuccess=resolve;q.onerror=()=>reject(q.error);q.onblocked=resolve});
  await api.ready();

  function salesPayload(prev,qty){
    return {previousClearAt:prev,elapsedHours:24,totalQty:qty,totalAmount:qty*100,products:[{productCode:"S1",printedName:"Sales",temperature:"COLD",column:1,price:100,salesQty:qty}],soldOuts:[],specialCircumstance:null};
  }
  function inputPayload(code){
    return {totalQty:1,items:[{productCode:code,printedName:"Input",temperature:"COLD",column:1,quantity:1}]};
  }
  async function createReport(record){
    return api.data.reports.create(Object.assign({status:"draft",source:{method:"manual",imageStored:false}},record));
  }

  // Same visit already has a trusted machine. A later related paper may carry a
  // different maker/vendor identity, but must inherit the trusted visit machine.
  const visit=await api.data.visits.put({machineId:"M-SAME",vendorKey:null,startedAt:"2026-09-18T08:00:00+09:00",endedAt:null,status:"open",machineSnapshot:null});
  const first=await createReport({
    type:"sales",makerKey:"maker-sales",vendorNumber:"SALES-001",machineId:"M-SAME",visitId:visit.id,
    occurredAt:"2026-09-18T09:00:00+09:00",original:salesPayload("2026-09-17T09:00:00+09:00",1),current:salesPayload("2026-09-17T09:00:00+09:00",1)
  });
  assert(first.machineId==="M-SAME","first report lost machine identity");
  const linkedVisit=await api.data.visits.get(visit.id);
  assert(linkedVisit.vendorKey===JSON.stringify(["maker-sales","SALES-001"]),"first report did not bind visit vendor");

  const second=await createReport({
    type:"input",makerKey:"maker-input",vendorNumber:"INPUT-999",machineId:null,visitId:visit.id,
    occurredAt:"2026-09-18T09:05:00+09:00",original:inputPayload("I1"),current:inputPayload("I1")
  });
  assert(second.machineId==="M-SAME","continued report did not inherit trusted visit machine");
  assert(second.vendorKey===JSON.stringify(["maker-input","INPUT-999"]),"continued report vendor identity was overwritten");

  // Safety remains fail-closed when no trusted same-machine context exists.
  const visitNoMachine=await api.data.visits.put({machineId:null,vendorKey:null,startedAt:"2026-09-18T10:00:00+09:00",endedAt:null,status:"open",machineSnapshot:null});
  await createReport({
    type:"sales",makerKey:"maker-a",vendorNumber:"A-001",machineId:null,visitId:visitNoMachine.id,
    occurredAt:"2026-09-18T10:05:00+09:00",original:salesPayload("2026-09-17T10:05:00+09:00",2),current:salesPayload("2026-09-17T10:05:00+09:00",2)
  });
  let vendorMismatch=false;
  try{
    await createReport({
      type:"input",makerKey:"maker-b",vendorNumber:"B-002",machineId:null,visitId:visitNoMachine.id,
      occurredAt:"2026-09-18T10:10:00+09:00",original:inputPayload("I2"),current:inputPayload("I2")
    });
  }catch(e){vendorMismatch=/Visit vendor mismatch/.test(String(e&&e.message||e))}
  assert(vendorMismatch,"vendor mismatch was not blocked without trusted machine context");

  // A genuinely different trusted machine must still be rejected.
  const visitMachine=await api.data.visits.put({machineId:"M-ONE",vendorKey:null,startedAt:"2026-09-18T11:00:00+09:00",endedAt:null,status:"open",machineSnapshot:null});
  let machineMismatch=false;
  try{
    await createReport({
      type:"input",makerKey:"maker-x",vendorNumber:"X-001",machineId:"M-TWO",visitId:visitMachine.id,
      occurredAt:"2026-09-18T11:05:00+09:00",original:inputPayload("I3"),current:inputPayload("I3")
    });
  }catch(e){machineMismatch=/Visit machine mismatch/.test(String(e&&e.message||e))}
  assert(machineMismatch,"different trusted machine was not blocked");

  const indexSource=await fetch("../index.html?gate="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("index fetch failed");return r.text()});
  assert(indexSource.includes('id="runReportOcr" type="button">もう一度読み取る</button>'),"OCR button is not retry-only");
  assert(indexSource.includes("updateReportOcrAvailability();if(reportOcrAdapter())setTimeout(runReportOcr,0)"),"captured image does not auto-start OCR");
  assert(indexSource.includes("button.classList.add('hidden');button.textContent='もう一度読み取る'"),"normal OCR path does not hide retry control");
  assert(indexSource.includes("button.classList.remove('hidden');button.textContent='もう一度読み取る'"),"OCR failure does not expose retry control");
  assert(indexSource.includes("2026.09.18-FINAL.20"),"FINAL.20 marker missing");
  assert(document.body.scrollWidth<=320,"320px gate overflow");
  out.textContent="PASS";
})().catch(e=>{document.getElementById("out").textContent="FAIL: "+(e&&e.stack||e);console.error(e)});
</script></body></html>
