<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simplified UI and tomorrow-plan carryover gate</title>
<style>html,body{margin:0;width:430px;max-width:100%}iframe{width:430px;max-width:100%;height:932px;border:0}</style></head>
<body><pre id="out">RUNNING</pre><iframe id="app" title="VENDRIVE test app"></iframe>
<script>
(async function(){
  const out=document.getElementById('out');
  const assert=(v,m)=>{if(!v)throw new Error(m)};
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const WEEK=['日','月','火','水','木','金','土'];
  const now=new Date(),today=iso(now),todayDay=WEEK[now.getDay()];
  const otherDay=WEEK[(now.getDay()+1)%7];
  const baseMachine=(id,name)=>({
    id,name,maker:'TEST',makerGroup:'TEST',code:id,address:'',lat:null,lng:null,
    days:[todayDay],cycle:'毎日',weeklyCount:null,last:'',visited:false,skip:null,force:null,
    order:null,timeCondition:{type:'none',start:'',end:''},temporaryVisitCycles:[],memo:'',sales:'',taskDone:{}
  });
  const add=baseMachine('M-ADD','追加予定');add.days=[otherDay];add.cycle='1週間に1回';add.last=today;
  const exclude=baseMachine('M-EXCLUDE','通常除外');
  const order=baseMachine('M-ORDER','緊急オーダー');order.order={type:'その他',sub:'',detail:'test',createdAt:Date.now()};
  const state={
    machines:[add,exclude,order],offices:[],history:[],
    tomorrowPlan:{date:today,ids:['M-ADD'],manual:true},
    tasks:[],taskHistory:[],temporaryVisitPeriods:[],restDays:[],
    makers:['TEST'],makerColors:{},makerSettings:[]
  };
  localStorage.setItem('vendrive2_v7_data',JSON.stringify(state));
  localStorage.setItem('vendrive2_last_day',today);
  const frame=document.getElementById('app');
  frame.src='../index.html?gate='+Date.now();
  for(let i=0;i<100;i++){
    await sleep(100);
    const d=frame.contentDocument;
    if(d&&d.getElementById('todayList')&&d.getElementById('heroTotal')&&d.getElementById('heroTotal').textContent!=='0')break;
  }
  const d=frame.contentDocument;
  assert(d,'app document unavailable');
  assert(!d.querySelector('.tabs button[data-page="analysisPage"]'),'analysis tab still visible');
  assert(!d.getElementById('analysisPage'),'analysis page still present');
  assert(!d.getElementById('reportCapture'),'report capture button still visible');
  assert(!d.getElementById('reportCaptureModal'),'report capture modal still present');
  const todayText=d.getElementById('todayList').textContent;
  assert(todayText.includes('追加予定'),'manual next-workday addition was not carried into Today');
  assert(!todayText.includes('通常除外'),'manual next-workday exclusion was not carried into Today');
  assert(todayText.includes('緊急オーダー'),'urgent order was incorrectly suppressed by manual plan');
  assert(d.getElementById('heroTotal').textContent==='2','Today total should be manual addition + urgent order');
  const saved=JSON.parse(localStorage.getItem('vendrive2_v7_data'));
  const addSaved=saved.machines.find(m=>m.id==='M-ADD');
  const excludeSaved=saved.machines.find(m=>m.id==='M-EXCLUDE');
  assert(addSaved&&addSaved.force===today&&addSaved.skip===null,'manual addition was not materialized as today force');
  assert(excludeSaved&&excludeSaved.skip===today&&excludeSaved.force===null,'manual exclusion was not materialized as today skip');
  assert(saved.tomorrowPlan&&saved.tomorrowPlan.appliedDate===today,'manual plan was not marked applied for today');
  assert(d.querySelectorAll('.tabs button').length===5,'navigation should contain five tabs after analysis removal');
  out.textContent='PASS\nsimplified UI: PASS\nmanual plan carryover: PASS\norder safety: PASS';
})().catch(e=>{document.getElementById('out').textContent='FAIL: '+(e&&e.stack||e);console.error(e)});
</script></body></html>
