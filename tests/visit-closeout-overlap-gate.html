(async function(){
 const out=document.getElementById("out"),api=window.VENDRIVE2Analytics;

 let prevCell=Array.from(host.querySelectorAll(".vdrCompactMetaCell")).find(x=>x.querySelector("span")&&x.querySelector("span").textContent==="前回クリア");assert(prevCell&&prevCell.classList.contains("error"),"sales rerender setup did not block invalid previous clear");
 prevCell.querySelector("button").click();let editInput=prevCell.querySelector(".vdrInlineEditor input");editInput.value="2026-09-17T11:00";prevCell.querySelector(".vdrInlineEditor .save").click();await sleep(120);
 assert(review.candidatePayload.previousClearAt==="2026-09-17T11:00:00+09:00","sales correction did not survive rerender");
 let approval=host.querySelector(".vdrCompactApproval input"),create=Array.from(host.querySelectorAll("button")).find(b=>b.textContent.includes("下書きを作成"));approval.checked=true;approval.dispatchEvent(new Event("change",{bubbles:true}));create.click();

 Array.from(host.querySelectorAll("button")).find(b=>b.textContent.includes("投入・回収なしで終了")).click();for(let i=0;i<30&&!finishDone;i++)await sleep(50);assert(finished&&finished.noInput&&finished.noRecovery,"no-service closeout options missing");assert(finishDone,"no-service closeout did not finish");
