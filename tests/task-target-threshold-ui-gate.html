<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task selection and threshold gate</title>
<style>html,body{margin:0;width:430px;max-width:100%}iframe{width:430px;max-width:100%;height:932px;border:0}</style></head>
<body><pre id="out">RUNNING</pre><iframe id="app" title="VENDRIVE test app"></iframe>
<script>
(async function(){
  const out=document.getElementById('out'),assert=(v,m)=>{if(!v)throw new Error(m)},sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const now=new Date(),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=iso(now),WEEK=['日','月','火','水','木','金','土'],todayDay=WEEK[now.getDay()];
  const machine=(id,name,maker)=>({id,name,maker:maker||'サントリー',makerGroup:maker||'サントリー',code:id,address:'',lat:null,lng:null,days:[todayDay],cycle:'毎日',weeklyCount:null,last:'',visited:false,skip:null,force:null,order:null,timeCondition:{type:'none',start:'',end:''},temporaryVisitCycles:[],memo:'',sales:'',taskDone:{}});
  const machines=[machine('M1','Machine 1'),machine('M2','Machine 2'),machine('M3','Machine 3'),machine('M4','Machine 4','コカコーラ')];
  machines[0].taskDone.LEGACY={completedAt:Date.now()-1000};
  const state={machines,offices:[],history:[],tomorrowPlan:null,tasks:[{id:'LEGACY',text:'Legacy threshold task',target:'all',targetMachineIds:['M1','M2','M3','M4'],createdAt:Date.now()-5000,completed:false}],taskHistory:[],temporaryVisitPeriods:[],restDays:[],makers:['サントリー','コカコーラ'],makerColors:{},makerSettings:[]};
  localStorage.setItem('vendrive2_v7_data',JSON.stringify(state));localStorage.setItem('vendrive2_last_day',today);

  const frame=document.getElementById('app');frame.src='../index.html?gate='+Date.now();
  for(let i=0;i<120;i++){await sleep(100);const d=frame.contentDocument;if(d&&d.getElementById('taskList')&&d.querySelector('.tabs button[data-page="tasksPage"]'))break}
  const d=frame.contentDocument,w=frame.contentWindow;assert(d&&w,'app unavailable');
  function click(el){assert(el,'missing clickable element');el.click()}
  function fire(el,type){el.dispatchEvent(new Event(type,{bubbles:true}))}
  function stored(){return JSON.parse(localStorage.getItem('vendrive2_v7_data'))}
  function taskByText(text){return stored().tasks.find(t=>t.text===text)}
  function openTab(page){click(d.querySelector('.tabs button[data-page="'+page+'"]'))}
  async function waitFor(fn,label){for(let i=0;i<80;i++){if(fn())return;await sleep(50)}throw new Error(label||'wait timeout')}

  const nav=d.querySelector('.tabs'),buttons=[...nav.querySelectorAll('button')],navRect=nav.getBoundingClientRect(),first=buttons[0].getBoundingClientRect(),last=buttons[buttons.length-1].getBoundingClientRect();
  assert(buttons.length===5,'expected five tabs');
  assert(first.left-navRect.left<=10.5,'left tab padding too large');
  assert(navRect.right-last.right<=10.5,'right side still has an empty tab-sized gap');

  openTab('tasksPage');
  let legacyCard=[...d.querySelectorAll('#taskList .taskCard')].find(x=>x.textContent.includes('Legacy threshold task'));click(legacyCard);
  assert(d.getElementById('taskDetailCompletionThreshold').value==='100','legacy task did not default to 100%');
  d.getElementById('taskDetailCompletionThreshold').value='25';click(d.getElementById('saveTaskDetail'));
  await waitFor(()=>taskByText('Legacy threshold task')&&taskByText('Legacy threshold task').completed===true,'legacy threshold edit did not auto-complete');

  // Selection mode must allow any number of individually chosen machines, not just one.
  openTab('tasksPage');click(d.getElementById('addTask'));
  d.getElementById('taskText').value='Selected machines task';d.getElementById('taskTargetMode').value='selected';fire(d.getElementById('taskTargetMode'),'change');
  const search=d.getElementById('taskMachineSearch');
  search.value='M2';fire(search,'input');click(d.querySelector('#taskMachineResults .taskAddResult'));
  search.value='M4';fire(search,'input');click(d.querySelector('#taskMachineResults .taskAddResult'));
  assert(d.getElementById('taskSelectedMachineCount').textContent==='2台','selection count should be 2');
  assert(d.querySelectorAll('#taskSelectedMachines .taskDetailMachine').length===2,'selected list should show two machines');
  d.getElementById('taskCompletionThreshold').value='70';click(d.getElementById('saveTask'));
  await waitFor(()=>!!taskByText('Selected machines task'),'selection task save');
  let selected=taskByText('Selected machines task');
  assert(selected.targetType==='selected','selection task type was not saved');
  assert(selected.targetMachineIds.length===2&&selected.targetMachineIds.includes('M2')&&selected.targetMachineIds.includes('M4'),'selection task did not preserve arbitrary machine set');
  assert(selected.completionThresholdPercent===70,'selection threshold not persisted');

  // Manufacturer-wide targeting must remain available.
  openTab('tasksPage');click(d.getElementById('addTask'));d.getElementById('taskText').value='Maker task';d.getElementById('taskCompletionThreshold').value='70';click(d.getElementById('saveTask'));
  await waitFor(()=>!!taskByText('Maker task'),'maker task save');
  let maker=taskByText('Maker task');assert(maker.targetType==='maker'&&maker.targetMachineIds.length===4,'manufacturer/all targeting regressed');

  async function completeNamedTaskOnMachine(code,taskText){
    openTab('machinesPage');const q=d.getElementById('machineSearch');q.value=code;fire(q,'input');
    const row=[...d.querySelectorAll('#machineResults .result')].find(x=>x.textContent.includes(code));click(row);
    await waitFor(()=>d.getElementById('machineModal').classList.contains('open'),'machine modal did not open');
    const taskRow=[...d.querySelectorAll('#detailTaskList > div')].find(x=>x.textContent.includes(taskText));assert(taskRow,'task not shown for '+code);click(taskRow.querySelector('button'));
    await sleep(60);click(d.getElementById('closeMachine'));
  }
  await completeNamedTaskOnMachine('M1','Maker task');
  assert(taskByText('Maker task').completed===false,'70% task completed at 25%');
  await completeNamedTaskOnMachine('M2','Maker task');
  assert(taskByText('Maker task').completed===false,'70% task completed at 50%');
  await completeNamedTaskOnMachine('M3','Maker task');
  await waitFor(()=>taskByText('Maker task').completed===true,'70% task did not auto-complete at 75%');

  // Existing selected task can still add/remove targets in detail, preserving selection semantics.
  openTab('tasksPage');let selectedCard=[...d.querySelectorAll('#taskList .taskCard')].find(x=>x.textContent.includes('Selected machines task'));click(selectedCard);
  assert(d.getElementById('taskDetailTarget').textContent.includes('選択型（2台）'),'selection label missing');
  const remove=d.querySelector('#taskDetailIncomplete .taskTargetRemove');click(remove);click(d.getElementById('saveTaskDetail'));
  await waitFor(()=>taskByText('Selected machines task').targetMachineIds.length===1,'selected task detail edit did not persist');
  selected=taskByText('Selected machines task');assert(selected.targetType==='selected','selection task lost target type after edit');

  out.textContent='PASS\nfull-width five-tab navigation: PASS\nselection-type multi-machine task creation: PASS\nmanufacturer targeting retained: PASS\nlegacy threshold editing: PASS\n70% auto-completion: PASS\nselection detail editing: PASS';
})().catch(e=>{document.getElementById('out').textContent='FAIL: '+(e&&e.stack||e);console.error(e)});
</script></body></html>
