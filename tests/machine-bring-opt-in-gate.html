<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machine bring opt-in gate</title><style>html,body{margin:0;width:320px;max-width:320px}body{overflow-x:hidden}</style></head>
<body><pre id="out">RUNNING</pre>
<script>
(function(){
  const machines=[
    {id:"M-ON",name:"Opt In",managementCode:"1001",managementCodeKey:"1001",maker:"サントリー",makerKey:"サントリー",address:"A",lat:null,lng:null,days:["土"],cycle:"1週間に1回",weeklyCount:null,timeCondition:null,bringRecommendationEnabled:true},
    {id:"M-OFF",name:"Explicit Off",managementCode:"1002",managementCodeKey:"1002",maker:"サントリー",makerKey:"サントリー",address:"B",lat:null,lng:null,days:["土"],cycle:"1週間に1回",weeklyCount:null,timeCondition:null,bringRecommendationEnabled:false},
    {id:"M-LEGACY",name:"Legacy Default",managementCode:"1003",managementCodeKey:"1003",maker:"サントリー",makerKey:"サントリー",address:"C",lat:null,lng:null,days:["土"],cycle:"1週間に1回",weeklyCount:null,timeCondition:null}
  ];
  const planningRows=machines.map((m,i)=>({id:m.id,last:"2026-09-12",visited:false,skip:null,force:null,orderPending:false,nextScheduledVisitDate:"2026-09-19"}));
  window.VENDRIVE2ReadBridge=Object.freeze({
    version:1,
    normalizeManagementCode:v=>String(v||"").trim().toLowerCase(),
    getMachinesSnapshot:()=>JSON.parse(JSON.stringify(machines)),
    getMachineSnapshot:id=>{const m=machines.find(x=>x.id===String(id));return m?JSON.parse(JSON.stringify(m)):null},
    getPlanningSnapshot:()=>({
      version:1,today:"2026-09-18",todayDay:"金",restDays:[],
      todayIds:machines.map(m=>m.id),
      tomorrow:{date:"2026-09-19",day:"土",ids:machines.map(m=>m.id),manual:false},
      machines:JSON.parse(JSON.stringify(planningRows))
    })
  });
})();
</script>
<script src="../analytics.js"></script>
<script>
(async function(){
  const out=document.getElementById("out"),api=window.VENDRIVE2Analytics;
  const assert=(v,m)=>{if(!v)throw new Error(m)};
  api.close();
  await new Promise((resolve,reject)=>{const q=indexedDB.deleteDatabase("VENDRIVE2_ANALYTICS_DB");q.onsuccess=resolve;q.onerror=()=>reject(q.error);q.onblocked=resolve});
  await api.ready();

  const indexSource=await fetch("../index.html?gate="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("index fetch failed");return r.text()});
  assert(indexSource.includes('id="mBringRecommendation"'),"existing-machine opt-in control missing");
  assert(indexSource.includes('id="newBringRecommendation"'),"new-machine opt-in control missing");
  assert(indexSource.includes("$id('newBringRecommendation').value='off'"),"new-machine reset is not OFF");
  assert(indexSource.includes("m.bringRecommendationEnabled===true?'on':'off'"),"legacy existing machines do not default OFF");
  assert(indexSource.includes("bringRecommendationEnabled:$id('newBringRecommendation').value==='on'"),"new-machine boolean is not persisted");
  assert(indexSource.includes("bringRecommendationEnabled:m.bringRecommendationEnabled===true"),"read bridge does not expose strict opt-in");

  function payload(previousClearAt,qty){
    return {previousClearAt,elapsedHours:24,totalQty:qty,totalAmount:qty*100,products:[{productCode:"P1",printedName:"Sample",temperature:"COLD",column:1,price:100,salesQty:qty}],soldOuts:[],specialCircumstance:null};
  }
  async function addSales(machineId,vendorNumber,hour){
    const occurredAt="2026-09-18T"+String(hour).padStart(2,"0")+":00:00+09:00";
    const previousClearAt="2026-09-17T"+String(hour).padStart(2,"0")+":00:00+09:00";
    const p=payload(previousClearAt,2);
    const report=await api.data.reports.create({type:"sales",status:"draft",makerKey:"suntory",vendorNumber,machineId,visitId:null,occurredAt,original:p,current:p,source:{method:"manual",imageStored:false}});
    const confirmed=await api.data.reports.confirm(report.id);
    assert(confirmed.confirmed===true,"sales report did not confirm for "+machineId);
  }
  await addSales("M-ON","1001",8);
  await addSales("M-OFF","1002",9);
  await addSales("M-LEGACY","1003",10);

  const visits=await api.analysis.planning.listVisitRecommendations({horizon:"next_workday"});
  assert(visits.length===3,"visit planning was incorrectly filtered by bring opt-in");
  const visitFlags=Object.fromEntries(visits.map(v=>[v.subject.machineId,v.subject.bringRecommendationEnabled]));
  assert(visitFlags["M-ON"]===true&&visitFlags["M-OFF"]===false&&visitFlags["M-LEGACY"]===false,"visit opt-in flags are wrong");

  const bring=await api.analysis.planning.listBringFromVehicleRecommendations({horizon:"next_workday"});
  assert(bring.length===1,"bring recommendation opt-in did not filter to exactly one machine");
  assert(bring[0].subject.machineId==="M-ON","OFF/default-OFF machine leaked into bring recommendations");
  const offSpecific=await api.analysis.planning.listBringFromVehicleRecommendations({horizon:"next_workday",machineId:"M-OFF"});
  const legacySpecific=await api.analysis.planning.listBringFromVehicleRecommendations({horizon:"next_workday",machineId:"M-LEGACY"});
  assert(offSpecific.length===0&&legacySpecific.length===0,"machine-specific query bypassed opt-in");

  const eod=await api.analysis.planning.getEndOfDayLoadingProposal({businessEnded:true});
  assert(eod.target.visitMachineIds.length===1&&eod.target.visitMachineIds[0]==="M-ON","EOD loading target ignored opt-in");
  assert(eod.coverage.visitCount===1,"EOD visit count includes disabled machines");
  assert(!eod.coverage.uncoveredVisitMachineIds.includes("M-OFF")&&!eod.coverage.uncoveredVisitMachineIds.includes("M-LEGACY"),"disabled machines were treated as missing coverage");
  assert(eod.items.every(item=>item.components.every(c=>c.machineId==="M-ON")),"disabled machine contributed to EOD demand");

  assert(document.body.scrollWidth<=320,"320px gate overflow");
  out.textContent="PASS";
})().catch(e=>{document.getElementById("out").textContent="FAIL: "+(e&&e.stack||e);console.error(e)});
</script></body></html>
