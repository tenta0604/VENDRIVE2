<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product master sync gate</title><link rel="stylesheet" href="../ops10a-stocktake.css"><style>*{box-sizing:border-box}body{font-family:sans-serif;width:min(100%,430px);margin:auto;padding:12px}.sheet,.ops10a-sheet{width:min(100%,430px);box-sizing:border-box}.modal{display:none}.modal.open{display:block}.hidden{display:none}.secondary,.primary{padding:8px}.analysisSubTabs{display:flex}.analysisSubTabs button{padding:6px}[data-analysis-section]{display:block}</style></head><body>
<section id="analysisPage"><div class="analysisSubTabs"><button data-analysis-section="inventory" class="active">在庫</button></div></section><pre id="out">RUNNING</pre>
<script>
window.openModal=function(id){document.getElementById(id).classList.add('open')};window.closeModal=function(id){document.getElementById(id).classList.remove('open')};window.toast=function(){};
function loadScript(src){return new Promise(function(resolve,reject){var s=document.createElement('script');s.src='../'+src+'?gate='+Date.now();s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
function assert(v,m){if(!v)throw new Error(m)}function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}async function waitFor(fn,label){for(var i=0;i<100;i++){if(fn())return;await sleep(50)}throw new Error(label||'wait timeout')}
(async function(){try{await new Promise(function(resolve,reject){var r=indexedDB.deleteDatabase('VENDRIVE2_ANALYTICS_DB');r.onsuccess=resolve;r.onerror=function(){reject(r.error)};r.onblocked=resolve});await loadScript('analytics.js');await window.VENDRIVE2Analytics.ready();await loadScript('product-master-hf2.js');await loadScript('ops10a-stocktake.js');var a=window.VENDRIVE2Analytics,i=window.VENDRIVE2ProductIntelligence;assert(i&&i.version===2,'product intelligence v2 unavailable');
var sales=await a.data.reports.create({type:'sales',status:'draft',makerKey:'TEST',vendorNumber:'V1',occurredAt:'2026-09-18T10:00:00+09:00',current:{previousClearAt:'2026-09-17T10:00:00+09:00',elapsedHours:24,totalQty:3,totalAmount:390,products:[{productCode:'10',printedName:'BOSS 厳選微糖 185g 缶',temperature:'COLD',column:1,price:130,salesQty:3}],soldOuts:[],specialCircumstance:null},original:{},source:{method:'ocr',imageStored:false}});await a.data.reports.confirm(sales.id);
var input=await a.data.reports.create({type:'input',status:'draft',makerKey:'TEST',vendorNumber:'V1',occurredAt:'2026-09-18T10:05:00+09:00',current:{totalQty:2,items:[{productCode:'2',printedName:'BOSS ブラック 185g 缶',temperature:'COLD',column:2,quantity:2}]},original:{},source:{method:'ocr',imageStored:false}});await a.data.reports.confirm(input.id);
await a.data.reports.create({type:'input',status:'draft',makerKey:'TEST',vendorNumber:'V1',occurredAt:'2026-09-18T10:06:00+09:00',current:{totalQty:1,items:[{productCode:'99',printedName:'未確認ドラフト商品 500ml PET',temperature:'COLD',column:3,quantity:1}]},original:{},source:{method:'ocr',imageStored:false}});
var sync=await i.syncProductsFromReports();assert(sync.total===2,'confirmed OCR product sync candidates mismatch');var products=await a.data.products.list();assert(products.length===2,'product master count mismatch');assert(!products.some(function(p){return p.productCode==='99'}),'draft OCR product leaked into master');var black=products.find(function(p){return p.productCode==='2'}),bito=products.find(function(p){return p.productCode==='10'});assert(black&&black.displayName.indexOf('ブラック')>=0,'black product name missing');assert(bito&&bito.displayName.indexOf('微糖')>=0,'low sugar product name missing');var bp=i.suggest(black),mp=i.suggest(bito);assert(bp.attributes.family==='コーヒー'&&bp.attributes.style==='ブラック'&&bp.attributes.sugar==='無糖'&&bp.attributes.milk==='なし','black classification proposal mismatch');assert(mp.attributes.family==='コーヒー'&&mp.attributes.style==='微糖'&&mp.attributes.sugar==='微糖','low sugar classification proposal mismatch');await i.confirm(black,bp);var saved=await i.get(black.id);assert(saved.status==='confirmed'&&saved.attributes.style==='ブラック','classification confirmation failed');var sorted=[{productCode:'10',displayName:'X 260ml',makerKey:'A'},{productCode:'2',displayName:'Y 500ml',makerKey:'A'},{productCode:'10',displayName:'Z 185ml',makerKey:'A'}].sort(i.compareProducts);assert(sorted[0].productCode==='2'&&sorted[1].displayName.indexOf('185')>=0&&sorted[2].displayName.indexOf('260')>=0,'product ordering mismatch');var events=await a.data.inventory.listEvents();assert(events.length===0,'sync changed inventory');var button=document.querySelector('#hf2ProductPanel button');assert(button,'product master button missing');button.click();await waitFor(function(){return document.querySelectorAll('#hf2ProductMaster .hf2row').length===2},'catalog rows mismatch');assert(document.getElementById('hf2ProductMaster').classList.contains('open'),'catalog did not open');var search=document.querySelector('#hf2ProductMaster .hf2search');search.value='微糖';search.dispatchEvent(new Event('input',{bubbles:true}));assert(document.querySelectorAll('#hf2ProductMaster .hf2row').length===1,'catalog classification search failed');window.closeModal('hf2ProductMaster');var fab=document.querySelector('.ops10a-fab');assert(fab,'stocktake button missing');fab.click();await waitFor(function(){return document.querySelectorAll('.ops10a-list .ops10a-row').length===2},'stocktake rows mismatch');var stockSearch=document.querySelector('.ops10a-search');stockSearch.value='ブラック';stockSearch.dispatchEvent(new Event('input',{bubbles:true}));assert(document.querySelectorAll('.ops10a-list .ops10a-row').length===1,'stocktake OCR product search failed');var appWidth=document.getElementById('analysisPage').getBoundingClientRect().width,stockWidth=document.querySelector('.ops10a-sheet').getBoundingClientRect().width;assert(appWidth<=430.5&&stockWidth<=430.5,'mobile width overflow');var stockClose=document.querySelector('.ops10a-close');if(stockClose)stockClose.click();document.getElementById('out').textContent='PASS\nconfirmed OCR sync: PASS\ndraft exclusion: PASS\nclassification proposals: PASS\nproduct master search: PASS\nstocktake OCR search: PASS\nproduct ordering: PASS\ninventory unchanged: PASS\nmobile width: PASS'}catch(e){document.getElementById('out').textContent='FAIL\n'+(e&&e.stack||e);throw e}})();
</script></body></html>
